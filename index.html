b": "tr a-z A-Z < file   (only reads stdin)"}, {"t": "vars", "f": "use a variable glued to text", "b": "\"${SYMBOL}lium\""}, {"t": "vars", "f": "export", "b": "export VAR=value → child processes (new bash) see it"}, {"t": "vars", "f": "PATH lookup", "b": "searched left → right, first match wins"}, {"t": "vars", "f": "login vs every shell", "b": "~/.bash_profile at login · ~/.bashrc every interactive shell (aliases)"}, {"t": "vars", "f": "alias", "b": "alias ll='ls -l'"}, {"t": "users", "f": "add to extra groups (keep old)", "b": "usermod -aG g1,g2 user"}, {"t": "users", "f": "change primary group", "b": "usermod -g group user   (temporary: newgrp group)"}, {"t": "users", "f": "/etc/passwd fields", "b": "name:x:UID:GID:comment:home:shell"}, {"t": "users", "f": "where are the passwords", "b": "/etc/shadow (hashed)"}, {"t": "users", "f": "root / normal / service UIDs", "b": "0 · ≥1000 · <1000 (shell nologin)"}, {"t": "users", "f": "sudo group on Red Hat", "b": "wheel  →  %wheel ALL=(ALL) ALL"}, {"t": "users", "f": "sudo password", "b": "your OWN password (unless NOPASSWD:)"}, {"t": "users", "f": "delete user + home", "b": "userdel -r user"}, {"t": "users", "f": "su vs su -", "b": "su - = full login environment of the new user"}, {"t": "users", "f": "force password change", "b": "chage -d 0 user"}, {"t": "users", "f": "sudo log", "b": "/var/log/secure"}, {"t": "perms", "f": "r w x octal", "b": "r=4 w=2 x=1 → 755 = rwxr-xr-x · 640 = rw-r-----"}, {"t": "perms", "f": "w on a directory", "b": "create AND delete files in it (deleting needs w on the dir, not the file!)"}, {"t": "perms", "f": "x on a directory", "b": "enter it with cd"}, {"t": "perms", "f": "umask", "b": "file 666 − umask · dir 777 − umask   (0022 → 644 / 755)"}, {"t": "perms", "f": "chown / chgrp", "b": "chown user:group file · chgrp group file"}, {"t": "perms", "f": "SUID · SGID · sticky", "b": "4 · 2 · 1 in front → s user · s group · t others"}, {"t": "perms", "f": "SGID on a directory", "b": "new files get the directory's group"}, {"t": "perms", "f": "sticky bit", "b": "only the owner can delete their files (/tmp = drwxrwxrwt)"}, {"t": "find", "f": "find by type / name / user", "b": "find /dir -type d · -name \"*.log\" · -user anna"}, {"t": "find", "f": "find by size / time", "b": "-size +10M · -mtime -1 (less than 1 day ago)"}, {"t": "find", "f": "tar create gzip", "b": "tar -czf archive.tar.gz dir"}, {"t": "find", "f": "tar extract / list", "b": "tar -xf a.tar(.gz) · tar -tf a.tar"}, {"t": "find", "f": "tar compression letters", "b": "z gzip · j bzip2 · J xz"}, {"t": "find", "f": "tar and leading /", "b": "removed → extract recreates home/student/... under current dir"}, {"t": "find", "f": "scp up / down", "b": "scp file user@host:~ · scp user@host:file ."}, {"t": "regex", "f": "grep options", "b": "-i ignore case · -v invert · -c count · -r recursive"}, {"t": "regex", "f": "^ and $", "b": "start of line · end of line"}, {"t": "regex", "f": ". and * in regex", "b": ". = one char · * = previous char 0+ times · .* = anything"}, {"t": "regex", "f": "vim save & quit", "b": "Esc then :wq   (quit without saving :q!)"}, {"t": "regex", "f": "vim edit keys", "b": "i insert · dd delete line · yy copy · p paste · u undo"}, {"t": "regex", "f": "vim replace all", "b": ":%s/old/new/g"}], "cheat": {"shell": ["ssh user@host", "ssh -p 2222 user@host", "ssh user@host \"uptime\"", "whoami · hostname · pwd · date", "history · !!", "ping -c 4 host · ip addr"], "view": ["cat file1 file2", "less file   (/word, n, q)", "head -n 5 file · tail -n 20 file", "tail -f /var/log/secure", "wc -l / -w / -c file", "file name · stat name"], "paths": ["/ root · ~ home · . here · .. parent", "cd (home) · cd - (previous)", "absolute = starts with /", "/etc config · /var/log logs · /home users · /root root's home"], "files": ["ls -la · ls -ld dir · ls -lt · ls -R", "mkdir -p a/b/c · rmdir empty", "touch f · cp -r src dst · mv old new", "rm -i f · rm -r dir"], "expand": ["* any · ? one char · [ab] · [!a]", "{1..5} · {a,b} · file{,.bak}", "$(cmd) command substitution", "'no expansion' · \"$VAR expands\""], "links": ["ln target hardlink", "ln -s target softlink", "hard = same inode · soft = stores the path"], "help": ["man cmd · man 5 passwd", "man -k word (apropos)", "cmd --help", "in man: /word n N q"], "redir": ["> overwrite · >> append · 2> errors · 2>&1 · &>", "2>/dev/null", "cmd1 | cmd2 · tee file", "cut -d \",\" -f 1 · sort (-n -r -u) · uniq", "head -n 3 f | tail -n 1", "tr a-z A-Z < file · grep pattern"], "vars": ["VAR=value (no spaces) · echo $VAR · ${VAR}text", "export VAR=value", "PATH: left → right", "~/.bash_profile (login) · ~/.bashrc (aliases)", "alias ll='ls -l' · set"], "users": ["id user · groups", "useradd · passwd · usermod · userdel -r", "usermod -aG g1,g2 user · usermod -g grp user", "groupadd · groupmod -n new old · groupdel", "newgrp grp · su - · sudo -i", "/etc/passwd · /etc/shadow · /etc/group · /etc/sudoers.d", "chage -d 0 user"], "perms": ["r4 w2 x1 · chmod 755 / u+x,g-w,o=r", "chown user:group f · chgrp grp f", "umask: 666/777 minus umask", "s on user = SUID 4 · s on group = SGID 2 · t = sticky 1", "dir: r list · w create/delete · x cd"], "find": ["find /dir -name \"*.log\" -type f -user anna", "-size +10M · -mtime -1 · -perm 777", "tar -czf a.tar.gz dir · -xf · -tf", "z gzip · j bzip2 · J xz", "scp file user@host:~ · scp user@host:file . · scp -r"], "regex": ["grep -i -v -c -r", "^start · end$ · . one char · .* anything", "vim: i · Esc · :wq · :q! · dd · yy · p · u", "vim: /word · :%s/old/new/g"]}};
const NOTES = [{"id": "shell", "n": "01", "title": "Linux, the shell & networking", "topic": "shell", "short": ["Linux is a kernel: the part of the OS that talks to the hardware.", "bash is the shell: it reads your commands and runs them.", "A command = command + options + arguments. You reach servers with ssh."], "html": "<p class=\"lead\">What Linux is, how a command is built, and how you reach a server.<\/p>\n<h2>What is Linux?<\/h2>\n<div class=\"cols\">\n<div>\n<ul>\n  <li><b>Operating system (OS)<\/b> = the software between the hardware and your programs: booting, controlling hardware, managing processes, memory and files.<\/li>\n  <li><b>Kernel<\/b> = the core of the OS. <b>Only the kernel can access the hardware.<\/b> Linux is a kernel.<\/li>\n  <li><b>Shell<\/b> = the program that reads and executes your commands. We use <b>bash<\/b> (Bourne Again Shell). Others: sh, zsh (macOS), csh, ksh, fish, PowerShell.<\/li>\n  <li><b>Distribution<\/b> = kernel + GNU tools + software, packaged. KdG uses <b>Red Hat<\/b>/<b>AlmaLinux<\/b> (Red Hat family). Ubuntu is Debian-based.<\/li>\n  <li>Linux is <b>open source<\/b> (FOSS) under the <b>GPL<\/b>. It runs everywhere: servers, phones (Android), routers, TVs, satellites.<\/li>\n<\/ul>\n<\/div>\n<div>\n<table>\n<tr><th>Year<\/th><th>Who / what<\/th><\/tr>\n<tr><td>1969<\/td><td>UNIX and C: Ken Thompson & Dennis Ritchie<\/td><\/tr>\n<tr><td>1985–89<\/td><td>GNU, free software: Richard Stallman<\/td><\/tr>\n<tr><td>1987<\/td><td>Minix: Andrew Tanenbaum<\/td><\/tr>\n<tr><td>1991<\/td><td>Linux kernel: <b>Linus Torvalds<\/b> (\"just a hobby, won't be big\")<\/td><\/tr>\n<\/table>\n<p class=\"small\">Layers: hardware (processor, memory, devices) → <b>kernel<\/b> → shell (bash), compiler (gcc), applications (GNU).<\/p>\n<\/div>\n<\/div>\n<h2>The prompt & command anatomy<\/h2>\n<pre>student@acs104:~$          ← user @ host : current directory  $ = normal user\nroot@acs104:/tmp#          ← # = root (superuser)<\/pre>\n<p>A command has 3 parts separated by spaces: <b>command<\/b> · <b>options<\/b> · <b>arguments<\/b>.<\/p>\n<pre>ls -l -a /etc       command = ls · options = -l -a · argument = /etc\nfmt -u -s x         command = fmt · options = -u -s · argument = x<\/pre>\n<ul>\n  <li>Several commands on one line: separate with <code>;<\/code> → <code>echo -n \"Today is: \" ; date +%x<\/code><\/li>\n  <li>One command over several lines: end the line with <code>\\<\/code>.<\/li>\n  <li><code>history<\/code> shows previous commands · <code>!!<\/code> repeats the last one · <code>!42<\/code> runs number 42 · <code>Ctrl+R<\/code> searches · <code>history -c<\/code> clears.<\/li>\n  <li><b>Tab<\/b> completes names · <b>Ctrl+C<\/b> stops a command · <b>Ctrl+D<\/b> ends the shell/input · <b>Ctrl+L<\/b> clears the screen.<\/li>\n  <li>Handy: <code>date<\/code> (<code>date +%R<\/code> time, <code>+%x<\/code> date, <code>+%A<\/code> weekday), <code>whoami<\/code>, <code>hostname<\/code>, <code>echo -e \"a\\tb\"<\/code> (-e interprets \\t, \\n), <code>passwd<\/code>.<\/li>\n<\/ul>\n<h2>Remote login: ssh<\/h2>\n<pre>ssh lpeeters@web03.example.com          log in as lpeeters on web03\nssh -p 2222 student@example.com         other port (default ssh port = 22)\nssh student@inf101 \"uptime\"             run one command remotely, then disconnect<\/pre>\n<p>Servers usually run <b>headless<\/b> (no screen, keyboard or mouse): you manage them over ssh. On old Windows you'd use PuTTY.<\/p>\n<h2>Basic networking<\/h2>\n<table>\n<tr><th>Concept<\/th><th>What you need to know<\/th><\/tr>\n<tr><td>IP address<\/td><td>the address of a device on the network, e.g. 10.134.176.104. Show yours: <code>ip addr<\/code> (<code>ip a<\/code>); old command <code>ifconfig<\/code>.<\/td><\/tr>\n<tr><td>Hostname & DNS<\/td><td>names like acs104.acs.kdg.be. <b>DNS<\/b> translates a name into an IP address. <code>hostname<\/code> shows the machine's name.<\/td><\/tr>\n<tr><td>Ports<\/td><td>a service listens on a port: <b>22 ssh<\/b>, 80 http, 443 https.<\/td><\/tr>\n<tr><td>ping<\/td><td>is a host reachable? <code>ping -c 4 example.com<\/code> (Linux keeps pinging until Ctrl+C without -c).<\/td><\/tr>\n<\/table>"}, {"id": "view", "n": "02", "title": "Viewing text files", "topic": "view", "short": ["Never trust a file extension: use file to see what a file really is.", "cat shows everything, less lets you scroll, head/tail show the start/end.", "wc counts lines (-l), words (-w) and bytes (-c)."], "html": "<p class=\"lead\">Linux configuration and logs are plain text files. These commands read them.<\/p>\n<table>\n<tr><th>Command<\/th><th>Does<\/th><th>Example<\/th><\/tr>\n<tr><td><code>file<\/code><\/td><td>real type of a file, by looking at the <b>content<\/b> (the extension means nothing in Linux)<\/td><td><code>file .bashrc<\/code><\/td><\/tr>\n<tr><td><code>stat<\/code><\/td><td>metadata: size, inode, links, permissions, access/modify/change/birth times<\/td><td><code>stat notes.txt<\/code><\/td><\/tr>\n<tr><td><code>cat<\/code><\/td><td>print the whole file (several files: one after the other)<\/td><td><code>cat gas.txt metal.txt<\/code><\/td><\/tr>\n<tr><td><code>less<\/code> / <code>more<\/code><\/td><td>page by page. less can go back with arrows; more only forward. <b>q<\/b> quits.<\/td><td><code>less /etc/passwd<\/code><\/td><\/tr>\n<tr><td><code>head<\/code><\/td><td>first lines (default 10)<\/td><td><code>head -n 5 file<\/code> = <code>head -5 file<\/code><\/td><\/tr>\n<tr><td><code>tail<\/code><\/td><td>last lines (default 10) · <code>-n+30<\/code> = from line 30 to the end · <code>-f<\/code> = follow live<\/td><td><code>tail -f /var/log/secure<\/code><\/td><\/tr>\n<tr><td><code>wc<\/code><\/td><td>count: no option = lines words bytes · <code>-l<\/code> lines · <code>-w<\/code> words · <code>-c<\/code> bytes · <code>-m<\/code> characters · <code>-L<\/code> longest line<\/td><td><code>wc -l /etc/passwd<\/code><\/td><\/tr>\n<\/table>\n<div class=\"box ex\"><b class=\"t\">Example: misleading extensions<\/b>\n<pre>$ file *\ndata.csv:   PNG image data, 640 x 480\nreadme:     ASCII text\nreport.pdf: ASCII text\nsong.mp3:   Audio file with ID3 version 2.4.0<\/pre>\nMisleading: <b>data.csv<\/b> (really a PNG) and <b>report.pdf<\/b> (really text). readme has no extension, so it can't be misleading.<\/div>\n<div class=\"box ex\"><b class=\"t\">Example: line 3 to 5, or the n-th line<\/b>\n<pre>head -n 5 flights.csv | tail -n 3      lines 3–5\nhead -n 3 flights.csv | tail -n 1      only line 3<\/pre><\/div>\n<div class=\"box trap\"><b class=\"t\">Trap<\/b><code>wc -l gas.txt<\/code> prints the count <b>and<\/b> the file name: <code>2 gas.txt<\/code>. Only the number? <code>wc -l &lt; gas.txt<\/code> or <code>cat gas.txt | wc -l<\/code>.<\/div>"}, {"id": "paths", "n": "03", "title": "File system & paths", "topic": "paths", "short": ["Absolute paths start with / and work from anywhere.", "Relative paths start where you are: .. = one folder up, . = here.", "cd alone takes you home. root's home is /root."], "html": "<p class=\"lead\">Everything hangs under one root <code>/<\/code>. Paths are the #1 question type on the practice exams.<\/p>\n<div class=\"cols\">\n<div>\n<h2>Important directories<\/h2>\n<table>\n<tr><td><code>/<\/code><\/td><td>root of the whole tree<\/td><\/tr>\n<tr><td><code>/etc<\/code><\/td><td>configuration files (passwd, ssh/sshd_config)<\/td><\/tr>\n<tr><td><code>/home<\/code><\/td><td>home dirs of normal users<\/td><\/tr>\n<tr><td><code>/root<\/code><\/td><td>home of root (not /home/root!)<\/td><\/tr>\n<tr><td><code>/tmp<\/code><\/td><td>temporary files<\/td><\/tr>\n<tr><td><code>/var<\/code><\/td><td>variable data · <code>/var/log<\/code> = logs<\/td><\/tr>\n<tr><td><code>/bin<\/code>, <code>/usr/bin<\/code><\/td><td>programs (commands)<\/td><\/tr>\n<tr><td><code>/srv<\/code><\/td><td>data served by the server (www)<\/td><\/tr>\n<tr><td><code>/opt<\/code><\/td><td>extra software / shared files<\/td><\/tr>\n<\/table>\n<h2>Special names<\/h2>\n<table>\n<tr><td><code>.<\/code><\/td><td>current directory<\/td><\/tr>\n<tr><td><code>..<\/code><\/td><td>parent directory<\/td><\/tr>\n<tr><td><code>~<\/code><\/td><td>your home (<code>~anna<\/code> = anna's home)<\/td><\/tr>\n<tr><td><code>cd<\/code><\/td><td>no argument → your home<\/td><\/tr>\n<tr><td><code>cd -<\/code><\/td><td>back to the previous directory<\/td><\/tr>\n<tr><td><code>pwd<\/code><\/td><td>print working directory<\/td><\/tr>\n<\/table>\n<\/div>\n<div>\n<h2>The exam tree<\/h2>\n<pre>/\n├── etc\n│   ├── passwd\n│   └── ssh\n│       └── sshd_config\n├── srv\n│   └── www\n│       ├── html\n│       │   └── index.html\n│       └── logs\n│           └── access.log\n├── tmp\n└── home\n    ├── anna\n    │   └── metal.txt\n    └── student\n        ├── docs\n        │   └── gas.txt\n        └── scripts\n            └── test.sh<\/pre>\n<\/div>\n<\/div>\n<h2>Absolute vs relative<\/h2>\n<ul>\n  <li><b>Absolute<\/b> path: starts with <code>/<\/code>. Same result wherever you are: <code>/home/student/docs/gas.txt<\/code>.<\/li>\n  <li><b>Relative<\/b> path: starts from where you are now (no leading /): <code>docs/gas.txt<\/code>, <code>../scripts/test.sh<\/code>.<\/li>\n  <li><code>~/scripts<\/code> is really absolute (~ is replaced by /home/student).<\/li>\n<\/ul>\n<div class=\"box key\"><b class=\"t\">Method for relative paths<\/b>1) From where you are, go up with <code>../<\/code> until you reach a folder that also contains the target. 2) Then go down to the target. Count carefully: one <code>../<\/code> per level.<\/div>\n<table>\n<tr><th>You are in<\/th><th>Question<\/th><th>Answer<\/th><\/tr>\n<tr><td>/home/student/scripts<\/td><td>absolute path of <code>../docs/gas.txt<\/code><\/td><td><code>/home/student/docs/gas.txt<\/code><\/td><\/tr>\n<tr><td>/home/anna<\/td><td>absolute path of <code>../student/docs/gas.txt<\/code><\/td><td><code>/home/student/docs/gas.txt<\/code><\/td><\/tr>\n<tr><td>/home/student/docs<\/td><td>relative path to test.sh<\/td><td><code>../scripts/test.sh<\/code><\/td><\/tr>\n<tr><td>/etc/ssh<\/td><td>relative path to index.html<\/td><td><code>../../srv/www/html/index.html<\/code><\/td><\/tr>\n<tr><td>/srv/www/logs<\/td><td>relative path to index.html<\/td><td><code>../html/index.html<\/code><\/td><\/tr>\n<tr><td>/home/anna<\/td><td>SHORTEST path to passwd<\/td><td><code>/etc/passwd<\/code> (relative ../../etc/passwd is longer)<\/td><\/tr>\n<tr><td>/srv/www/html<\/td><td>pwd after <code>cd ../../../home/./anna<\/code><\/td><td><code>/home/anna<\/code> (<code>.<\/code> changes nothing)<\/td><\/tr>\n<tr><td>/tmp (as student)<\/td><td>pwd after <code>cd<\/code><\/td><td><code>/home/student<\/code><\/td><\/tr>\n<\/table>"}, {"id": "files", "n": "04", "title": "Managing files & directories", "topic": "files", "short": ["mkdir -p makes folders (and missing parents), touch makes empty files.", "cp copies, mv moves AND renames, rm deletes forever.", "Directories need -r for cp and rm."], "html": "<table>\n<tr><th>Command<\/th><th>Does<\/th><th>Must-know options<\/th><\/tr>\n<tr><td><code>ls<\/code><\/td><td>list a directory<\/td><td><code>-l<\/code> long · <code>-a<\/code> also hidden (names starting with .) · <code>-d<\/code> the dir itself · <code>-t<\/code> by time · <code>-R<\/code> recursive · <code>-h<\/code> human sizes<\/td><\/tr>\n<tr><td><code>mkdir<\/code><\/td><td>make directory<\/td><td><code>-p<\/code> also create missing parents: <code>mkdir -p work/todo<\/code><\/td><\/tr>\n<tr><td><code>rmdir<\/code><\/td><td>remove an <b>empty<\/b> directory<\/td><td>fails if not empty<\/td><\/tr>\n<tr><td><code>touch<\/code><\/td><td>create empty file / update timestamp<\/td><td><code>touch todo.txt<\/code><\/td><\/tr>\n<tr><td><code>cp<\/code><\/td><td>copy<\/td><td><code>-r<\/code> directories (recursive) · <code>-i<\/code> ask before overwrite · <code>-a<\/code> keep everything<\/td><\/tr>\n<tr><td><code>mv<\/code><\/td><td>move <b>and/or rename<\/b><\/td><td><code>mv old.txt new.txt<\/code> · <code>-i<\/code> ask first<\/td><\/tr>\n<tr><td><code>rm<\/code><\/td><td>remove (no recycle bin!)<\/td><td><code>-r<\/code> directories · <code>-i<\/code> ask · <code>-f<\/code> force · <code>-d<\/code> empty dir<\/td><\/tr>\n<\/table>\n<div class=\"box ex\"><b class=\"t\">Exam examples<\/b>\n<pre>mv docs/gas.txt scripts/elements.txt     move AND rename in one go (you are in /home/student)\ncp docs/gas.txt scripts                  copy, keep the name\nmv scripts/test.sh .                     move to the current directory\nrm -r work                               work contains files → rmdir would fail\ncp -r docs backup                        copy a directory with its contents\nls -ld /tmp                              permissions of /tmp itself, not its contents<\/pre><\/div>\n<div class=\"box trap\"><b class=\"t\">Traps<\/b><code>mv a b<\/code> overwrites b without asking. <code>ls -r<\/code> = reverse order, <code>ls -R<\/code> = recursive. <code>ls -l /tmp<\/code> shows what's <i>inside<\/i> /tmp; add <code>-d<\/code> for the directory itself.<\/div>"}, {"id": "expand", "n": "05", "title": "Shell expansion & quoting", "topic": "expand", "short": ["bash replaces wildcards before the command runs: * any, ? one char, [ab] one of.", "{1..3} and {a,b} generate words, $(cmd) inserts a command's output.", "'single quotes' stop everything, \"double quotes\" still expand $VARS."], "html": "<p class=\"lead\">Before a command runs, <b>bash<\/b> rewrites the line: wildcards, braces, ~, variables and $( ). The command only receives the result.<\/p>\n<div class=\"cols\">\n<div>\n<table>\n<tr><th>Pattern<\/th><th>Means<\/th><\/tr>\n<tr><td><code>*<\/code><\/td><td>0 or more characters<\/td><\/tr>\n<tr><td><code>?<\/code><\/td><td>exactly 1 character<\/td><\/tr>\n<tr><td><code>[ab]<\/code><\/td><td>1 character: a or b<\/td><\/tr>\n<tr><td><code>[0-9]<\/code><\/td><td>1 digit<\/td><\/tr>\n<tr><td><code>[!a]<\/code> / <code>[^a]<\/code><\/td><td>1 character, NOT a<\/td><\/tr>\n<tr><td><code>{1..3}<\/code><\/td><td>1 2 3<\/td><\/tr>\n<tr><td><code>{a,b}<\/code><\/td><td>a b<\/td><\/tr>\n<tr><td><code>~<\/code><\/td><td>home directory<\/td><\/tr>\n<tr><td><code>$(cmd)<\/code><\/td><td>output of cmd (command substitution)<\/td><\/tr>\n<\/table>\n<\/div>\n<div>\n<pre>$ ls data\na1.txt  a10.txt  ab.txt  b1.txt  b2.csv<\/pre>\n<table>\n<tr><th>Command<\/th><th>Shows<\/th><\/tr>\n<tr><td><code>ls data/a*<\/code><\/td><td>a1.txt a10.txt ab.txt<\/td><\/tr>\n<tr><td><code>ls data/??.txt<\/code><\/td><td>a1.txt ab.txt b1.txt<\/td><\/tr>\n<tr><td><code>ls data/?[0-9].*<\/code><\/td><td>a1.txt b1.txt b2.csv<\/td><\/tr>\n<tr><td><code>ls data/*[0-9].*<\/code><\/td><td>a1.txt a10.txt b1.txt b2.csv<\/td><\/tr>\n<tr><td><code>ls data/[!a]*<\/code><\/td><td>b1.txt b2.csv<\/td><\/tr>\n<\/table>\n<\/div>\n<\/div>\n<pre>echo {a,b}{1,2}               → a1 a2 b1 b2\ntouch report{1..3}.txt        → report1.txt report2.txt report3.txt\nmkdir 2026-{01..12}           → 12 directories 2026-01 … 2026-12\nmv notes.txt{,.bak}           → mv notes.txt notes.txt.bak\necho \"Today is $(date +%A)\"   → Today is Monday<\/pre>\n<div class=\"box key\"><b class=\"t\">Quotes<\/b><code>'single'<\/code> = <b>nothing<\/b> is expanded: <code>echo '$HOME'<\/code> → <code>$HOME<\/code>. <code>\"double\"<\/code> = $variables and $( ) still expand: <code>echo \"$HOME\"<\/code> → <code>/home/student<\/code>. Use quotes around patterns you want to pass to a command unchanged, e.g. <code>find / -name \"*.log\"<\/code>.<\/div>"}, {"id": "links", "n": "06", "title": "Hard & soft links", "topic": "links", "short": ["A hard link is a second name for the same data (same inode).", "A soft link is a shortcut that stores a path: it breaks when the target is deleted.", "Create with ln (hard) or ln -s (soft)."], "html": "<p class=\"lead\">A file's data lives in an <b>inode<\/b>. A file name is just a pointer to that inode.<\/p>\n<pre>$ ls -l\n-rw-r--r--. 2 student student 6 Oct 11 06:00 gas-hard\nlrwxrwxrwx. 1 student student 7 Oct 11 06:01 data -> gas.txt\n-rw-r--r--. 2 student student 6 Oct 11 06:00 gas.txt<\/pre>\n<table>\n<tr><th><\/th><th>Hard link<\/th><th>Soft (symbolic) link<\/th><\/tr>\n<tr><td>Create<\/td><td><code>ln gas.txt gas-hard<\/code><\/td><td><code>ln -s gas.txt data<\/code><\/td><\/tr>\n<tr><td>What it is<\/td><td>a second <b>name<\/b> for the <b>same inode<\/b><\/td><td>a small file that stores a <b>path<\/b> (like a shortcut)<\/td><\/tr>\n<tr><td>In ls -l<\/td><td>looks like a normal file; link count goes up (2)<\/td><td>starts with <b>l<\/b>, shows <code>data -&gt; gas.txt<\/code>, size = length of the path (7)<\/td><\/tr>\n<tr><td>Original deleted<\/td><td><b>still works<\/b> (data stays while one name exists)<\/td><td><b>breaks<\/b> (dangling link → error)<\/td><\/tr>\n<tr><td>Directories / other file systems<\/td><td>no<\/td><td>yes<\/td><\/tr>\n<\/table>\n<div class=\"box ex\"><b class=\"t\">Practice-exam questions<\/b>\nAfter <code>rm gas.txt<\/code>: <code>cat data<\/code> gives an error, <code>cat gas-hard<\/code> still shows He, Ne. After <code>echo \"Ar\" &gt;&gt; gas-hard<\/code>: <code>cat gas.txt<\/code> shows He Ne Ar (same inode). After <code>rm gas-hard<\/code>: the link count of gas.txt becomes 1.<\/div>"}, {"id": "help", "n": "07", "title": "Getting help", "topic": "help", "short": ["man command opens the manual; /word searches, q quits.", "Section 1 = commands, 5 = file formats, 8 = admin commands.", "man -k word searches all manuals; cmd --help gives a short help."], "html": "<table>\n<tr><th>Command<\/th><th>Does<\/th><\/tr>\n<tr><td><code>man passwd<\/code><\/td><td>manual page (from /usr/share/man)<\/td><\/tr>\n<tr><td><code>man 1 passwd<\/code> / <code>man 5 passwd<\/code><\/td><td>section 1 = user commands (the command) · section 5 = file formats (the file /etc/passwd) · section 8 = admin commands<\/td><\/tr>\n<tr><td><code>man -k time<\/code> (= <code>apropos<\/code>)<\/td><td>search titles and descriptions<\/td><\/tr>\n<tr><td><code>man -K time<\/code><\/td><td>search the full text of all pages (slow, Ctrl+C to stop)<\/td><\/tr>\n<tr><td><code>passwd --help<\/code><\/td><td>short help from the command itself<\/td><\/tr>\n<\/table>\n<div class=\"cols\">\n<div><b>Keys inside man / less<\/b><br><code>/word<\/code> search · <code>n<\/code> next match · <code>N<\/code> previous · <code>space<\/code> next page · <code>q<\/code> quit<\/div>\n<div><b>Synopsis notation<\/b><br><code>[ ]<\/code> optional · <code>&lt; -l | -r | -e &gt;<\/code> or <code>a|b<\/code> mutually exclusive (pick one) · <code>…<\/code> can repeat<\/div>\n<\/div>"}, {"id": "redir", "n": "08", "title": "Redirection & pipelines", "topic": "redir", "short": ["Output (1) and errors (2) can go to files: > overwrite, >> append, 2> errors.", "A pipe | sends the output of one command into the next.", "sort, uniq, cut, tr, grep, wc are the building blocks of pipelines."], "html": "<p class=\"lead\">Every command has 3 channels. You can send them to files or to other commands.<\/p>\n<table>\n<tr><th>#<\/th><th>Name<\/th><th>Default<\/th><th>Redirect<\/th><\/tr>\n<tr><td>0<\/td><td>stdin (input)<\/td><td>keyboard<\/td><td><code>&lt; file<\/code><\/td><\/tr>\n<tr><td>1<\/td><td>stdout (output)<\/td><td>screen<\/td><td><code>&gt; file<\/code> overwrite · <code>&gt;&gt; file<\/code> append<\/td><\/tr>\n<tr><td>2<\/td><td>stderr (errors)<\/td><td>screen<\/td><td><code>2&gt; file<\/code> · <code>2&gt;&gt; file<\/code> · <code>2&gt;/dev/null<\/code> throw away<\/td><\/tr>\n<tr><td colspan=\"3\">both together<\/td><td><code>&gt; file 2&gt;&amp;1<\/code> (order matters!) or <code>&amp;&gt; file<\/code><\/td><\/tr>\n<\/table>\n<pre>echo \"B\" >> elements.txt                          add a line at the bottom (> would wipe the file!)\ncat gas.txt metal.txt > elements.txt              combine two files\nfind /etc -name \"passwd\" 2>/dev/null              hide the \"Permission denied\" errors\nfind /etc -name passwd > all.txt 2>&1             results AND errors in all.txt\nfind /etc -name passwd > found.txt 2>> error.log  results in found.txt, errors appended\nls /var/log | wc -l                               count entries\nls /etc | tee etc.txt                             screen AND file\ntr a-z A-Z < names.txt                            tr only reads stdin<\/pre>\n<h2>Text tools for pipelines<\/h2>\n<table>\n<tr><td><code>sort<\/code><\/td><td>alphabetical · <code>-n<\/code> numeric · <code>-r<\/code> reverse · <code>-u<\/code> unique · <code>-t, -k2<\/code> by field<\/td><\/tr>\n<tr><td><code>uniq<\/code><\/td><td>removes <b>adjacent<\/b> duplicate lines → always <code>sort<\/code> first · <code>-c<\/code> counts<\/td><\/tr>\n<tr><td><code>cut<\/code><\/td><td><code>-d \",\"<\/code> delimiter · <code>-f 1<\/code> field 1 · <code>-f 1,3<\/code> fields 1 and 3 · <code>-c 1-5<\/code> characters<\/td><\/tr>\n<tr><td><code>tr<\/code><\/td><td>translate characters: <code>tr a-z A-Z<\/code> · <code>tr -d<\/code> delete<\/td><\/tr>\n<tr><td><code>grep<\/code><\/td><td>lines that match a pattern (chapter 14)<\/td><\/tr>\n<tr><td><code>tee<\/code><\/td><td>T-junction: to a file and further down the pipe<\/td><\/tr>\n<tr><td><code>nl<\/code><\/td><td>number the lines<\/td><\/tr>\n<\/table>\n<div class=\"cols\">\n<div class=\"box ex\"><b class=\"t\">flights.csv (dep,dest,time)<\/b>\n<pre>BRU,JFK,08:15\nAMS,CDG,09:40\nBRU,LHR,10:05\nFRA,BRU,11:30\nAMS,BRU,12:00\nCDG,FRA,13:25\nBRU,AMS,14:50\nFRA,JFK,16:10<\/pre>\n<code>cut -d \",\" -f 1 flights.csv | sort | uniq<\/code> → AMS BRU CDG FRA<br>\n<code>head -n 3 flights.csv | tail -n 1<\/code> → BRU,LHR,10:05<br>\n<code>grep ^BRU flights.csv<\/code> → only departures from BRU<br>\n<code>cut -d \",\" -f 2 flights.csv | grep BRU | wc -l<\/code> → 2\n<\/div>\n<div class=\"box ex\"><b class=\"t\">servers.txt (name-ip-status-load)<\/b>\n<pre>web01-10.0.0.21-up-12\ndb01-10.0.0.35-down-7\nweb02-10.0.0.22-up-110\nmail01-10.0.0.40-up-25<\/pre>\n<code>cut -d \"-\" -f 1,3 servers.txt | sort | tail -n 1<\/code> → web02-up<br>\n<code>cut -d \"-\" -f 4 servers.txt | sort | head -n 1<\/code> → <b>110<\/b><br>\n<code>cut -d \"-\" -f 4 servers.txt | sort | tail -n 1<\/code> → <b>7<\/b><br>\n<code>cut -d \"-\" -f 4 servers.txt | sort -n | tail -n 1<\/code> → 110<br>\n<code>grep up servers.txt | wc -l<\/code> → 3\n<\/div>\n<\/div>\n<div class=\"box trap\"><b class=\"t\">The sort trap (in both practice exams)<\/b>Without <code>-n<\/code>, sort compares <b>character by character<\/b>: <code>110 &lt; 12 &lt; 25 &lt; 7<\/code>. With <code>-n<\/code>: 7 12 25 110. And <code>grep BRU<\/code> also matches FRA,<b>BRU<\/b>: use <code>^BRU<\/code> for \"starts with\".<\/div>"}, {"id": "vim", "n": "09", "title": "Editing text with vim", "topic": "regex", "short": ["vim has modes: normal mode for commands, insert mode for typing.", "i to type, Esc to stop typing.", ":wq saves and quits, :q! quits without saving."], "html": "<p class=\"lead\">vi/vim is on every UNIX system and works without a mouse. Practise with <code>vimtutor<\/code>.<\/p>\n<div class=\"cols\">\n<div>\n<b>Modes<\/b>\n<ul>\n<li><b>Normal/command mode<\/b> (start here): move, delete, copy.<\/li>\n<li><b>Insert mode<\/b>: type text. Enter with <code>i<\/code> (before cursor), <code>a<\/code> (after), <code>I<\/code>/<code>A<\/code> (start/end of line), <code>o<\/code>/<code>O<\/code> (new line below/above).<\/li>\n<li><b>Esc<\/b> = back to normal mode.<\/li>\n<li><b>Extended mode<\/b>: type <code>:<\/code> in normal mode.<\/li>\n<\/ul>\n<\/div>\n<div>\n<table>\n<tr><td><code>x<\/code> / <code>dd<\/code><\/td><td>delete char / line<\/td><\/tr>\n<tr><td><code>yy<\/code> / <code>p<\/code><\/td><td>copy line / paste<\/td><\/tr>\n<tr><td><code>u<\/code><\/td><td>undo<\/td><\/tr>\n<tr><td><code>G<\/code> / <code>1G<\/code><\/td><td>last / first line<\/td><\/tr>\n<tr><td><code>/word<\/code> <code>n<\/code><\/td><td>search, next<\/td><\/tr>\n<tr><td><code>:w<\/code> · <code>:w file<\/code><\/td><td>save · save as<\/td><\/tr>\n<tr><td><code>:wq<\/code> = <code>:x<\/code><\/td><td>save and quit<\/td><\/tr>\n<tr><td><code>:q!<\/code><\/td><td>quit without saving<\/td><\/tr>\n<tr><td><code>:%s/old/new/g<\/code><\/td><td>replace everywhere<\/td><\/tr>\n<\/table>\n<\/div>\n<\/div>"}, {"id": "vars", "n": "10", "title": "Variables & environment", "topic": "vars", "short": ["NAME=value creates a variable (no spaces!), $NAME uses it.", "export makes it visible to programs you start.", "PATH is the list of folders where bash looks for commands, left to right."], "html": "<pre>count=40                    no spaces around = !   (type is always text)\nfull_name=\"John Doe\"\necho $count                 use with $\necho ${count}x${count}      ${ } marks where the name ends → 40x40   ($countx = unknown variable)\nunset count                 delete\nset | grep count            set = all variables · env = only environment variables<\/pre>\n<ul>\n  <li>A normal variable exists only in the <b>current shell<\/b>. <code>export<\/code> makes it an <b>environment variable<\/b>: child processes (a new <code>bash<\/code>, programs you start) see it. Convention: UPPERCASE names.<\/li>\n  <li>Common ones: <code>HOME<\/code> your home · <code>USER<\/code> your name · <code>HOSTNAME<\/code> · <code>LANG<\/code> language (changes date/error messages) · <code>EDITOR<\/code> · <code>SHELL<\/code> · <code>PS1<\/code> the prompt · <code>HISTTIMEFORMAT<\/code> · <code>PATH<\/code>.<\/li>\n  <li><b>PATH<\/b> = directories (separated by <code>:<\/code>) where bash looks for programs, <b>left to right, first match wins<\/b>. Extend it: <code>export PATH=${PATH}:/home/student/bin<\/code>. Find which program runs: <code>which ls<\/code>.<\/li>\n<\/ul>\n<div class=\"cols\">\n<div class=\"box ex\"><b class=\"t\">Export or not?<\/b>\n<pre>$ var=Hello          $ export var=Hello\n$ bash               $ bash\n$ echo $var          $ echo $var\n(empty line)         Hello<\/pre><\/div>\n<div class=\"box ex\"><b class=\"t\">Glue a variable to text<\/b>\n<pre>$ SYMBOL=He\n$ echo \"${SYMBOL}lium\"\nHelium<\/pre>\n<code>$SYMBOLlium<\/code> would look for a variable called SYMBOLlium.<\/div>\n<\/div>\n<div class=\"box ex\"><b class=\"t\">PATH question<\/b><code>PATH=/home/student/bin:/usr/local/bin:/usr/bin<\/code> and <code>ls<\/code> exists in /home/student/bin and /usr/bin → <code>/home/student/bin/ls<\/code> runs (it comes first).<\/div>\n<h2>Startup scripts<\/h2>\n<table>\n<tr><td><code>/etc/profile<\/code>, <code>/etc/bashrc<\/code><\/td><td>for all users<\/td><\/tr>\n<tr><td><code>~/.bash_profile<\/code><\/td><td>runs at <b>login<\/b> (e.g. a welcome message: <code>echo \"Welcome $USER on $HOSTNAME\"<\/code> → Welcome anna on web03)<\/td><\/tr>\n<tr><td><code>~/.bashrc<\/code><\/td><td>runs for every interactive shell: put your <b>aliases<\/b> and settings here: <code>export EDITOR=nano<\/code><\/td><\/tr>\n<\/table>\n<pre>alias ll=\"ls -las\"          make a shortcut      unalias ll     remove it<\/pre>"}, {"id": "users", "n": "11", "title": "Users, groups & sudo", "topic": "users", "short": ["Users live in /etc/passwd, passwords in /etc/shadow, groups in /etc/group.", "useradd, usermod, userdel, passwd manage users. usermod -aG adds groups.", "sudo runs one command as root with YOUR password."], "html": "<h2>The 3 files<\/h2>\n<pre>/etc/passwd   donald:x:1005:1010:D.Trump:/home/donald:/bin/bash\n              name : password(x) : UID : GID(primary group) : comment : home : login shell\n/etc/shadow   the hashed passwords (only root can read it) + password ageing\n/etc/group    developers:x:1050:anna,student      groupname : x : GID : members<\/pre>\n<table>\n<tr><th>Account<\/th><th>UID<\/th><th>Notes<\/th><\/tr>\n<tr><td>root (superuser)<\/td><td>0<\/td><td>can do everything · prompt #<\/td><\/tr>\n<tr><td>system/service accounts<\/td><td>&lt; 1000<\/td><td>e.g. mail, apache · shell <code>/usr/sbin/nologin<\/code>: nobody logs in with them<\/td><\/tr>\n<tr><td>normal users<\/td><td>≥ 1000<\/td><td>defaults (UID_MIN…) in <code>/etc/login.defs<\/code><\/td><\/tr>\n<\/table>\n<p>Every user has <b>one primary group<\/b> (usually a group with the same name) and can be in many <b>secondary (supplementary) groups<\/b>. New files get the primary group.<\/p>\n<h2>Commands<\/h2>\n<table>\n<tr><th>Task<\/th><th>Command<\/th><\/tr>\n<tr><td>who am I / which groups<\/td><td><code>whoami<\/code> · <code>id<\/code> · <code>id student<\/code> · <code>groups student<\/code><\/td><\/tr>\n<tr><td>create user / set password<\/td><td><code>useradd trinity<\/code> · <code>passwd trinity<\/code><\/td><\/tr>\n<tr><td>add to extra groups, <b>keep<\/b> the old ones<\/td><td><code>usermod -aG teachers,operator student<\/code> (-a append, -G secondary, no space after the comma)<\/td><\/tr>\n<tr><td>change the primary group<\/td><td><code>usermod -g matrix neo<\/code> (small g)<\/td><\/tr>\n<tr><td>lock / unlock account<\/td><td><code>usermod -L neo<\/code> / <code>usermod -U neo<\/code><\/td><\/tr>\n<tr><td>delete user + home dir<\/td><td><code>userdel -r neo<\/code> (without -r the home dir stays)<\/td><\/tr>\n<tr><td>force password change next login<\/td><td><code>chage -d 0 anna<\/code> · <code>chage -l anna<\/code> shows ageing info<\/td><\/tr>\n<tr><td>groups<\/td><td><code>groupadd matrix<\/code> · <code>groupmod -n zion matrix<\/code> (rename: new old) · <code>groupdel zion<\/code><\/td><\/tr>\n<tr><td>temporarily switch primary group<\/td><td><code>newgrp operator<\/code> → new files get group operator<\/td><\/tr>\n<\/table>\n<div class=\"box trap\"><b class=\"t\">Trap<\/b><code>usermod -G developers student<\/code> <b>without -a<\/b> replaces all his secondary groups by only developers.<\/div>\n<h2>Becoming root: su & sudo<\/h2>\n<ul>\n  <li><code>su -<\/code> (= <code>su -l<\/code>, <code>su --login<\/code>): become root with root's full login environment, using <b>root's<\/b> password. <code>su<\/code> without <code>-<\/code> keeps your environment.<\/li>\n  <li><code>sudo command<\/code>: run one command as root with <b>your own<\/b> password, if you're allowed. <code>sudo -i<\/code> = root shell. <code>sudo whoami<\/code> → <code>root<\/code>.<\/li>\n  <li>Rules live in <code>/etc/sudoers<\/code> and files in <code>/etc/sudoers.d/<\/code>. On Red Hat, members of group <b>wheel<\/b> may do everything: <code>%wheel ALL=(ALL) ALL<\/code>.<\/li>\n  <li>All sudo actions are logged in <code>/var/log/secure<\/code>.<\/li>\n<\/ul>\n<pre>devops       ALL=(ALL)       ALL                  user devops: everything, own password\n%developers  ALL=(ALL)       /usr/bin/dnf up      group (%) developers: only \"dnf up\"\n%games       ALL=(operator)  /bin/id              group games may run /bin/id AS user operator\nanna         ALL=(ALL)       NOPASSWD: ALL        no password asked\nwho          host=(as whom)  which commands<\/pre>"}, {"id": "perms", "n": "12", "title": "Permissions", "topic": "perms", "short": ["Every file has permissions for owner (u), group (g) and others (o).", "r=4 w=2 x=1: chmod 750 = rwxr-x---.", "On a folder, w means you can create and delete files in it."], "html": "<pre>-rwxr-x---.  1  student  team  120  Oct 14 10:00  backup.sh\n│└┬┘└┬┘└┬┘      └─owner─┘ └group┘\n│ u   g   o     (user = owner, group, others)\n└ type: - file · d directory · l link<\/pre>\n<table>\n<tr><th><\/th><th>On a file<\/th><th>On a directory<\/th><\/tr>\n<tr><td><b>r<\/b> = 4<\/td><td>read the content<\/td><td>list the names inside (<code>ls<\/code>)<\/td><\/tr>\n<tr><td><b>w<\/b> = 2<\/td><td>change the content<\/td><td><b>create, delete and rename<\/b> files inside<\/td><\/tr>\n<tr><td><b>x<\/b> = 1<\/td><td>execute (run as program)<\/td><td>enter it (<code>cd<\/code>) and reach the files inside<\/td><\/tr>\n<\/table>\n<div class=\"box trap\"><b class=\"t\">Deleting a file needs w on the DIRECTORY<\/b>\n<pre>dr-xr-xr-x  shared/                    student cannot rm shared/notes.txt,\n-rw-rw-rw-  shared/notes.txt           even though notes.txt is rw for everyone.\nFix: chmod u+w shared   (or chmod 755 shared)<\/pre><\/div>\n<div class=\"cols\">\n<div>\n<h2>chmod<\/h2>\n<pre>chmod 750 backup.sh       octal: rwx r-x ---\nchmod u+x,g-r run.sh      symbolic: who(u g o a) +-= what(r w x)\nchmod +x script.sh        x for everyone\nchmod o+w shared          others may create files in shared\nchmod -R g+w project      recursive<\/pre>\n<table>\n<tr><td>7 rwx<\/td><td>6 rw-<\/td><td>5 r-x<\/td><td>4 r--<\/td><\/tr>\n<tr><td>3 -wx<\/td><td>2 -w-<\/td><td>1 --x<\/td><td>0 ---<\/td><\/tr>\n<\/table>\n<p class=\"small\">755 = rwxr-xr-x · 750 = rwxr-x--- · 644 = rw-r--r-- · 640 = rw-r----- · 600 = rw------- · 604 = rw----r--<\/p>\n<\/div>\n<div>\n<h2>chown / chgrp<\/h2>\n<pre>chown anna report.txt         new owner\nchgrp team report.txt         new group\nchown :team report.txt        same\nchown anna:team report.txt    both at once\nchown -R anna /srv/project    recursive<\/pre>\n<h2>umask<\/h2>\n<p>Takes permissions away from new files and directories.<br>Files start at <b>666<\/b> (never x), directories at <b>777<\/b>.<\/p>\n<table>\n<tr><th>umask<\/th><th>new file<\/th><th>new dir<\/th><\/tr>\n<tr><td>0022<\/td><td>644 rw-r--r--<\/td><td>755 rwxr-xr-x<\/td><\/tr>\n<tr><td>0027<\/td><td>640 rw-r-----<\/td><td>750 rwxr-x---<\/td><\/tr>\n<tr><td>0077<\/td><td>600 rw-------<\/td><td>700 rwx------<\/td><\/tr>\n<\/table>\n<\/div>\n<\/div>\n<h2>Special permissions<\/h2>\n<table>\n<tr><th>Bit<\/th><th>Octal (in front)<\/th><th>Symbolic<\/th><th>Shows as<\/th><th>Effect<\/th><\/tr>\n<tr><td>SUID<\/td><td>4<\/td><td><code>u+s<\/code><\/td><td><code>-rwsr-xr-x<\/code><\/td><td>file runs with the rights of its <b>owner<\/b> (e.g. /usr/bin/passwd runs as root). Not on scripts.<\/td><\/tr>\n<tr><td>SGID<\/td><td>2<\/td><td><code>g+s<\/code><\/td><td><code>drwxrwsr-x<\/code><\/td><td>on a directory: new files get the <b>group of the directory<\/b> (team folders)<\/td><\/tr>\n<tr><td>Sticky<\/td><td>1<\/td><td><code>o+t<\/code><\/td><td><code>drwxrwxrwt<\/code><\/td><td>on a directory: only the owner can delete their own files (/tmp)<\/td><\/tr>\n<\/table>\n<pre>chmod 2775 /srv/project  → drwxrwsr-x     chmod 4755 prog → -rwsr-xr-x     chmod 1777 dropbox → drwxrwxrwt<\/pre>\n<div class=\"box ex\"><b class=\"t\">SGID example<\/b><code>/srv/project<\/code> is <code>drwxrwsr-x root projectteam<\/code>. student (member of projectteam) runs <code>touch /srv/project/report.txt<\/code> → the file's group is <b>projectteam<\/b>, not student.<\/div>"}, {"id": "find", "n": "13", "title": "Find, tar & scp", "topic": "find", "short": ["find searches for files by name, type, size, owner or time.", "tar packs folders into one archive: c create, x extract, t list, f file.", "scp copies files to and from a server over ssh."], "html": "<h2>find: looks for files (not inside files)<\/h2>\n<pre>find [start-dir] [select options] [action]\n\nfind / -name \"host\" 2>/dev/null          by name (quote patterns: \"*.log\")\nfind ~ -type f        find ~ -type d      only files / only directories  (l = links)\nfind / -size +100M    find ~ -size -1k    bigger than 100 MB / smaller than 1 kB\nfind /home -user anna                     owned by user\nfind /opt -group docker                   owned by group\nfind /srv -perm 777                       exact permissions\nfind /tmp -empty                          empty files/dirs\nfind / -regex \".*host\"                    regex on the full path<\/pre>\n<table>\n<tr><th>Time option<\/th><th>Means<\/th><\/tr>\n<tr><td><code>-mtime<\/code> / <code>-mmin<\/code><\/td><td><b>m<\/b>odify: the content changed (days / minutes)<\/td><\/tr>\n<tr><td><code>-ctime<\/code> / <code>-cmin<\/code><\/td><td><b>c<\/b>hange: the metadata changed (permissions, owner…); modifying also changes it<\/td><\/tr>\n<tr><td><code>-atime<\/code> / <code>-amin<\/code><\/td><td><b>a<\/b>ccess: opened/read<\/td><\/tr>\n<tr><td colspan=\"2\"><code>-mtime -1<\/code> = less than 1 day ago · <code>-mtime +3<\/code> = more than 3 days ago · <code>-mtime 7<\/code> = exactly 7 days · <code>-amin -5<\/code> opened &lt; 5 min ago<\/td><\/tr>\n<\/table>\n<pre>find ~ -size +10M -exec mv {} ~/Desktop \\;                 {} = each file found, \\; ends -exec\nfind / -user vbox -type f -exec grep -l 'Tania' {} \\; 2>/dev/null<\/pre>\n<h2>tar: Tape ARchiver<\/h2>\n<p>Packs files and folders into one file, keeping all metadata (owner, permissions, times). Not compressed unless you add z/j/J.<\/p>\n<table>\n<tr><th>Letter<\/th><th>Means<\/th><th>Letter<\/th><th>Means<\/th><\/tr>\n<tr><td><b>c<\/b><\/td><td>create<\/td><td><b>z<\/b><\/td><td>gzip → .tar.gz / .tgz<\/td><\/tr>\n<tr><td><b>x<\/b><\/td><td>extract<\/td><td><b>j<\/b><\/td><td>bzip2 → .tar.bz2<\/td><\/tr>\n<tr><td><b>t<\/b><\/td><td>list contents (table)<\/td><td><b>J<\/b><\/td><td>xz → .tar.xz<\/td><\/tr>\n<tr><td><b>v<\/b><\/td><td>verbose<\/td><td><b>f<\/b><\/td><td>file name follows → put f <b>last<\/b><\/td><\/tr>\n<\/table>\n<pre>tar -cf /tmp/backup.tar /home /etc        create          tar -tf /tmp/backup.tar     list (-tvf: details)\ntar -czf /tmp/home.tar.gz /home/student   create + gzip   tar -xf /tmp/backup.tar     extract here\ntar -cjf docs.tar.bz2 docs                bzip2           tar -cJf docs.tar.xz docs   xz<\/pre>\n<div class=\"box trap\"><b class=\"t\">The leading / trap<\/b>tar says <code>Removing leading '/' from member names<\/code>: it stores <code>home/student/docs/gas.txt<\/code>. Extracting in <code>/tmp<\/code> → <code>/tmp/home/student/docs/gas.txt<\/code>. Root extracting in his home (<code>cd<\/code> → /root) a backup of /srv/www → <code>/root/srv/www/html/index.html<\/code>.<\/div>\n<h2>scp: secure copy (over ssh)<\/h2>\n<pre>scp localfile user@host:path                      upload\nscp backup.tgz student@inf101.inf.kdg.be:~        to your home on the server (\":\" alone also = home)\nscp anna@web03:report.txt .                       download to the current directory\nscp -r docs student@inf101:~                      directories need -r<\/pre>\n<p class=\"small\">Same protocol, login and encryption as ssh. Keys (public = for everyone, private = only you) are stored in <code>~/.ssh<\/code>. Other transfer tools: sftp, rsync, ftp, nfs.<\/p>"}, {"id": "regex", "n": "14", "title": "grep, regex & sed", "topic": "regex", "short": ["grep shows the lines that match a pattern; -i -v -c -o change how.", "Regex: . any char, ^ start, $ end, [ ] one of, * + ? {n} repeat.", "sed edits text in a stream: s/old/new/g replaces."], "html": "<p class=\"lead\">This chapter has no Red Hat material: the slides are leading. In this course: <b>always use -E<\/b> (extended regex) and put the pattern in quotes.<\/p>\n<h2>grep: lines that match<\/h2>\n<table>\n<tr><td><code>grep 'nobody' /etc/passwd<\/code><\/td><td>lines containing nobody<\/td><\/tr>\n<tr><td><code>-i<\/code><\/td><td>ignore case<\/td><\/tr>\n<tr><td><code>-v<\/code><\/td><td>invert: lines that do NOT match<\/td><\/tr>\n<tr><td><code>-c<\/code><\/td><td>count matching lines<\/td><\/tr>\n<tr><td><code>-l<\/code><\/td><td>only the names of files that contain it: <code>sudo grep -l 'status' /var/log/*log<\/code><\/td><\/tr>\n<tr><td><code>-o<\/code><\/td><td>only the matching part, one per line: <code>grep -oE '[0-9]+'<\/code><\/td><\/tr>\n<tr><td><code>-r<\/code><\/td><td>recursive through a directory<\/td><\/tr>\n<tr><td><code>-s<\/code><\/td><td>silent: suppress error messages<\/td><\/tr>\n<tr><td><code>-E<\/code><\/td><td>extended regex (= <code>egrep<\/code>)<\/td><\/tr>\n<\/table>\n<div class=\"cols\">\n<div>\n<h2>Regex building blocks<\/h2>\n<table>\n<tr><td><code>.<\/code><\/td><td>exactly 1 character (any)<\/td><\/tr>\n<tr><td><code>\\.<\/code><\/td><td>a real dot (escape with \\)<\/td><\/tr>\n<tr><td><code>^word<\/code> / <code>word$<\/code><\/td><td>at start / end of line<\/td><\/tr>\n<tr><td><code>\\bword<\/code> / <code>word\\b<\/code><\/td><td>word starts / ends here<\/td><\/tr>\n<tr><td><code>[aeiou]<\/code><\/td><td>1 of these characters<\/td><\/tr>\n<tr><td><code>[a-z]<\/code> <code>[0-9]<\/code><\/td><td>1 lowercase / 1 digit<\/td><\/tr>\n<tr><td><code>[^0-9]<\/code><\/td><td>NOT a digit<\/td><\/tr>\n<tr><td><code>[[:digit:]]<\/code> <code>[[:alpha:]]<\/code> <code>[[:space:]]<\/code><\/td><td>POSIX classes, only inside [ ]<\/td><\/tr>\n<tr><td><code>(the|a)<\/code><\/td><td>one or the other<\/td><\/tr>\n<\/table>\n<\/div>\n<div>\n<h2>Repetition<\/h2>\n<table>\n<tr><td><code>x*<\/code><\/td><td>0 or more x<\/td><\/tr>\n<tr><td><code>x+<\/code><\/td><td>1 or more<\/td><\/tr>\n<tr><td><code>x?<\/code><\/td><td>0 or 1<\/td><\/tr>\n<tr><td><code>x{5}<\/code><\/td><td>exactly 5<\/td><\/tr>\n<tr><td><code>x{2,}<\/code><\/td><td>2 or more<\/td><\/tr>\n<tr><td><code>x{2,4}<\/code><\/td><td>2 to 4<\/td><\/tr>\n<tr><td><code>.*<\/code><\/td><td>anything<\/td><\/tr>\n<\/table>\n<p class=\"small\"><code>\\d<\/code> does not work in grep: use <code>[0-9]<\/code>.<\/p>\n<\/div>\n<\/div>\n<pre>grep -E '^root' /etc/passwd                   lines starting with root\ngrep -E 'bash$' /etc/passwd                   lines ending with bash\ngrep -E 'w[aeiou]rd' text.txt                 ward word wird…\ngrep -E 'th(at|is)' text.txt                  that or this\ngrep -oE '([0-9]{1,3}\\.){3}[0-9]{1,3}' auth.log     all IPv4 addresses\ngrep -E 'Invalid user' auth.log | wc -l             failed logins with an unknown user<\/pre>\n<div class=\"box trap\"><b class=\"t\">Globbing ≠ regex<\/b>Shell glob: <code>*<\/code> = any characters, <code>?<\/code> = 1 character, <code>.<\/code> = a dot. Regex: <code>*<\/code> = the previous character 0+ times, <code>?<\/code> = previous 0 or 1 time, <code>.<\/code> = any character. So <code>ls *.txt<\/code> vs <code>ls | grep -E '.*\\.txt'<\/code>.<\/div>\n<h2>sed: stream editor<\/h2>\n<p>Reads input, changes it, writes to the screen. The file itself is <b>not<\/b> changed unless you use <code>-i<\/code>.<\/p>\n<pre>sed -E 's/home/Users/g' /etc/passwd     substitute every 'home' (g = global, all on the line)\nsed -E 's/[0-9]+/(&)/g' file           & = the matched text → put numbers between ( )\nsed -i -E 's/haa/hoo/' file            -i = edit the file in place (no undo!) · -i.bak keeps a backup\nsed '1d' · sed '$d' · sed '2,4d'        delete line 1 / last line / lines 2-4\nsed -n '2,4p'                           print only lines 2-4\nsed '1i text' · sed '3a text'           insert before line 1 / append after line 3\nsed '1,5s/X/Y/g'                        replace only on lines 1-5<\/pre>\n<div class=\"box trap\"><b class=\"t\">sed pitfalls<\/b><code>sed … file &gt; file<\/code> empties the file first → empty file. <code>sed -iE<\/code> treats E as the backup suffix: write <code>sed -i -E<\/code>.<\/div>"}, {"id": "traps", "n": "15", "title": "Top exam traps", "topic": null, "short": ["These are the mistakes that cost points in the practice exams.", "Read them the evening before the exam.", "Then do one more mock exam."], "html": "<p class=\"lead\">These come straight from the patterns in both practice exams. Read them the night before.<\/p>\n<ol>\n  <li><b>&gt; vs &gt;&gt;<\/b>: <code>&gt;<\/code> overwrites the whole file, <code>&gt;&gt;<\/code> appends.<\/li>\n  <li><b>Errors are stream 2<\/b>: hide with <code>2&gt;/dev/null<\/code>. Everything in one file: <code>&gt; file 2&gt;&amp;1<\/code> or <code>&amp;&gt; file<\/code>.<\/li>\n  <li><b>sort without -n is alphabetical<\/b>: 110 comes before 7.<\/li>\n  <li><b>uniq needs sort first<\/b> (or use <code>sort -u<\/code>).<\/li>\n  <li><b>grep BRU<\/b> also matches FRA,BRU → <code>grep ^BRU<\/code>.<\/li>\n  <li><b>Relative paths<\/b>: count the <code>../<\/code> from the directory you're IN. The shortest path is often the absolute one.<\/li>\n  <li><b>cd without argument<\/b> = your home. <b>root's home<\/b> = /root.<\/li>\n  <li><b>? = exactly one character<\/b> in globbing. <code>??.txt<\/code> skips a10.txt.<\/li>\n  <li><b>'single quotes'<\/b> = no expansion at all. <code>echo '$HOME'<\/code> prints $HOME.<\/li>\n  <li><b>${VAR}text<\/b> when text follows directly. No spaces around = when assigning.<\/li>\n  <li><b>No export → the child shell doesn't see it<\/b> (empty line).<\/li>\n  <li><b>PATH is searched left → right<\/b>, first match wins.<\/li>\n  <li><b>usermod -aG<\/b> (with -a!) to add groups; <b>-g<\/b> = primary group.<\/li>\n  <li><b>sudo asks YOUR password<\/b> (unless NOPASSWD). su asks the target user's password.<\/li>\n  <li><b>Deleting/creating files needs w on the directory<\/b>, not on the file.<\/li>\n  <li><b>umask<\/b>: files from 666, directories from 777.<\/li>\n  <li><b>s in the group position<\/b> on a directory (SGID) → new files get the directory's group. <b>t<\/b> = sticky.<\/li>\n  <li><b>Soft link breaks<\/b> when the target is deleted; a hard link doesn't.<\/li>\n  <li><b>tar f comes last<\/b> before the archive name; tar strips the leading <code>/<\/code> and recreates the path where you extract.<\/li>\n  <li><b>scp<\/b>: remote side = <code>user@host:path<\/code>; empty path after <code>:<\/code> = home. Directories need <code>-r<\/code>.<\/li>\n  <li><b>ls -ld<\/b> for a directory's own permissions. <b>ls -R<\/b> recursive (not -r).<\/li>\n  <li><b>wc -l file<\/b> prints \"count filename\".<\/li>\n  <li>Man sections: <b>1<\/b> commands, <b>5<\/b> file formats, <b>8<\/b> admin. <code>man -k<\/code> = search.<\/li>\n<\/ol>\n<div class=\"box key\"><b class=\"t\">On the day<\/b>Schoolyear installed and tested on campus, VPN software removed, laptop charged. Arrive early and check the exact room code. Answer briefly and precisely: a command, a path or the exact output. Don't add sudo unless asked.<\/div>"}];
</script>
<script>
(() => {
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
const app = $('#app');
const T = Object.fromEntries(DATA.topics.map(([k,n],i) => [k,{n,e:`<span class="num">${String(i+1).padStart(2,'0')}</span>`}]));
const TK = DATA.topics.map(t => t[0]);

// ---------- storage (works even when blocked)
let S = {theme:null, topics:[], hist:[], tstats:{}, best:0, known:{}};
try { Object.assign(S, JSON.parse(localStorage.getItem('osf-lab')||'{}')); } catch(e){}
const save = () => { try { localStorage.setItem('osf-lab', JSON.stringify(S)); } catch(e){} };

// ---------- helpers
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmtQ = s => esc(s).replace(/ {2}(\S(?:.*?\S)?) {2}/g, ' <code>$1</code> ').replace(/ {2}(\S(?:.*?\S)?)( ?[.?!])?$/,' <code>$1</code>$2');
const preHTML = it => (it.sc ? `<pre class="sc">${esc(DATA.sc[it.sc])}</pre>` : '') + (it.pre ? `<pre class="sc">${esc(it.pre)}</pre>` : '');
const toast = m => { const d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),1800); };
function confetti(){}

// ---------- answer checking
function norm(s){
  s = String(s).replace(/[‘’`´]/g,"'").replace(/[“”]/g,'"').replace(/ /g,' ').trim().replace(/\s+/g,' ');
  s = s.replace(/^\$\s*/,'').replace(/^#\s+/,'').replace(/^sudo\s+/,'');
  s = s.replace(/\s*\|\s*/g,' | ').replace(/\s*;\s*/g,'; ').replace(/;\s*$/,'');
  s = s.replace(/\s*(\d?>>?|&>|<)\s*/g,' $1').trim();
  s = s.replace(/(^|\s)(-[a-zA-Z])\s+(?=[^-\s|])/g,'$1$2');
  s = s.replace(/(\S)\/$/,'$1');
  return s;
}
const unq = s => s.replace(/["']/g,'');
function setTokens(s, strip){
  let t = String(s).replace(/\band\b/gi,' ').split(/[\s,;]+/).filter(Boolean);
  if (strip) t = t.map(x => x.startsWith(strip) ? x.slice(strip.length) : x);
  return t.map(x=>x.replace(/\/$/,'')).sort().join(' ');
}
function variants(it, input){
  const v = [input];
  if (it.k === 'blank' && it.pre){
    const line = it.pre.split('\n').find(l => /_{4,}/.test(l)) || '';
    const parts = line.split(/_{4,}/), pre = norm(parts[0]), post = norm(parts[parts.length-1]);
    let x = norm(input);
    if (pre && x.startsWith(pre)) { x = x.slice(pre.length).trim(); v.push(x); }
    if (post && x.endsWith(post)) v.push(x.slice(0, x.length-post.length).trim());
  }
  return v;
}
function check(it, input){
  if (!String(input).trim()) return false;
  if (it.k === 'blank') return variants(it, input).some(x => check1(it, x));
  return check1(it, input);
}
function check1(it, input){
  if (!String(input).trim()) return false;
  const ci = x => it.ci ? x.toLowerCase() : x;
  if (it.set){ const u = ci(setTokens(input, it.strip)); return it.a.some(a => ci(setTokens(a, it.strip)) === u); }
  const u = ci(norm(input));
  return it.a.some(a => { const n = ci(norm(a)); return n === u || unq(n) === unq(u); });
}

// ---------- streak
let streak = 0;
function hit(ok, topic){
  streak = ok ? streak+1 : 0;
  if (streak > (S.best||0)) S.best = streak;
  if (topic){ const t = S.tstats[topic] ||= {ok:0,n:0}; t.n++; if (ok) t.ok++; }
  save(); $('#streak').textContent = 'streak ' + streak;
  if (ok && streak && streak % 10 === 0){ toast(`${streak} in a row. nice.`); }
}

// ---------- theme
function applyTheme(){ const t = S.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = t; $('#theme').textContent = t === 'dark' ? 'light' : 'dark'; }
$('#theme').onclick = () => { S.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); };
applyTheme();

// ---------- topic filter
const sel = () => (S.topics && S.topics.length) ? S.topics : TK;
function chips(onchange){
  const on = new Set(sel());
  const all = on.size === TK.length;
  return `<div class="chips" id="chips"><button class="chip ${all?'on':''}" data-t="*">all topics</button>${TK.map(k=>`<button class="chip ${!all&&on.has(k)?'on':''}" data-t="${k}">${T[k].e}${esc(T[k].n)}</button>`).join('')}</div>`;
}
function bindChips(onchange){
  document.querySelectorAll('#chips .chip').forEach(b => b.onclick = () => {
    const t = b.dataset.t; let cur = new Set(S.topics && S.topics.length ? S.topics : []);
    if (t === '*') cur = new Set(); else { cur.has(t) ? cur.delete(t) : cur.add(t); if (cur.size === TK.length) cur = new Set(); }
    S.topics = [...cur]; save(); onchange();
  });
}

// ---------- nav
const ROUTES = [['', 'Home'],['notes','Notes'],['mock','Mock exam'],['quiz','Quiz'],['fill','Fill & predict'],['term','Terminal'],['flash','Flashcards'],['cheat','Cheat sheet']];
function nav(r){ $('#tabs').innerHTML = ROUTES.map(([k,n]) => `<a href="#/${k}" class="${k===r?'on':''}">${n}</a>`).join(''); }

// ================= HOME
function home(){
  const last = S.hist && S.hist.length ? S.hist[S.hist.length-1] : null;
  const rows = TK.map(k => { const t = S.tstats[k]; const p = t && t.n ? Math.round(100*t.ok/t.n) : null;
    return `<div class="topicrow">${T[k].e}<span>${esc(T[k].n)}</span><div class="bar ${p==null?'':p>=70?'ok':p<50?'bad':''}"><i style="width:${p??0}%"></i></div><span class="mono small">${p==null?'—':p+'%'}</span></div>`; }).join('');
  app.innerHTML = `
  <h1>Pass OSF<br><span class="hl">without crying.</span></h1>
  <p class="lead">Practice for the Operating System Fundamentals T1 exam: closed book, 1 hour, short answers. Every question is built from the Canvas chapters, slides and both practice exams.</p>
  <div class="facts"><span class="pill">${DATA.sa.length} exam-style Qs</span><span class="pill">${DATA.mcq.length} quiz Qs</span><span class="pill">${DATA.flash.length} flashcards</span><span class="pill">13 topics</span></div>
  <div class="grid" style="margin-top:18px">
    <a class="mode big" href="#/notes"><div class="em">00 — learn</div><h3>Notes</h3><p>15 short chapters in easy English: explanations, examples, traps and live demos. Start here.</p></a>
    <a class="mode big" href="#/mock"><div class="em">01 — exam</div><h3>Mock exam</h3><p>25 random exam-style questions, 60-min timer, score per topic at the end. Different every time.</p></a>
    <a class="mode" href="#/term"><div class="em">02 — drill</div><h3>Terminal</h3><p>Type the command. Instant check. The closest thing to the real exam.</p></a>
    <a class="mode" href="#/fill"><div class="em">03 — drill</div><h3>Fill & predict</h3><p>Fill the ________ and predict outputs: paths, permissions, pipes.</p></a>
    <a class="mode" href="#/quiz"><div class="em">04 — concepts</div><h3>Quiz</h3><p>Quick multiple choice for the concepts.</p></a>
    <a class="mode" href="#/flash"><div class="em">05 — memory</div><h3>Flashcards</h3><p>Flip, remember, repeat the ones you don't know.</p></a>
    <a class="mode" href="#/cheat"><div class="em">06 — reference</div><h3>Cheat sheet</h3><p>All the commands on one page (for studying, not the exam).</p></a>
  </div>
  <div class="card"><div class="row"><b>Your topics</b><span class="sp"></span>${last?`<span class="small muted">last mock: <b>${last.p}%</b> · best streak: ${S.best||0}</span>`:`<span class="small muted">answer questions to fill these up</span>`}</div>${rows}
  <div class="row" style="margin-top:12px"><button class="btn sm ghost" id="reset">Reset progress</button><span class="small muted" id="rmsg"></span></div></div>
  <footer>made for KdG ACS · OSF 2026–27 · not official · double-check with your course PDFs</footer>`;
  const rb = $('#reset'); let armed = false;
  rb.onclick = () => {
    if (!armed){ armed = true; rb.textContent = 'Tap again to reset everything'; rb.classList.add('danger'); setTimeout(() => { if (armed && document.body.contains(rb)){ armed = false; rb.textContent = 'Reset progress'; rb.classList.remove('danger'); } }, 4000); return; }
    S.hist=[]; S.tstats={}; S.best=0; S.known={}; S.topics=[]; S.fl=null; save();
    streak = 0; $('#streak').textContent = 'streak 0'; mock = null; quiz = null; fl = null; drill = {};
    home(); toast('Progress reset');
  };
}

// ================= MOCK
let mock = null, timer = null;
function pickMock(){
  const by = {}; DATA.sa.forEach((q,i) => (by[q.t] ||= []).push(i));
  let ids = [];
  TK.forEach(k => ids.push(...shuffle(by[k]).slice(0,2)));
  ids = shuffle(ids).slice(0,25);
  return ids.sort((a,b) => TK.indexOf(DATA.sa[a].t) - TK.indexOf(DATA.sa[b].t) || a-b);
}
function mockStart(){
  app.innerHTML = `<h2>Mock exam</h2><p class="lead">25 questions across all 13 topics, in the same style as Piet's practice exams. Answer briefly: a command, a path or a few words. Closed book, so no peeking.</p>
  <div class="card"><label class="row"><input type="checkbox" id="tm" checked> <span>60-minute timer (like the real thing)</span></label>
  <p class="small muted" style="margin:10px 0 0">Tips: you don't need <code>sudo</code> or <code>$</code>. Spaces and quotes are flexible. If the checker marks a correct answer wrong, you can click "count it" in the review.</p></div>
  <div class="row"><button class="btn pri" id="go">Start the exam →</button></div>
  ${S.hist && S.hist.length ? `<div class="card"><b>History</b>${S.hist.slice(-8).reverse().map(h=>`<div class="row small" style="margin-top:6px"><span class="mono">${esc(h.d)}</span><span class="sp"></span><b>${h.p}%</b><span class="muted">(${h.s}/${h.n})</span></div>`).join('')}</div>`:''}`;
  $('#go').onclick = () => { mock = {ids: pickMock(), ans: {}, t0: Date.now(), timed: $('#tm').checked, done:false}; mockRun(); };
}
function mockRun(){
  let lastT = null;
  const qs = mock.ids.map((id,i) => { const it = DATA.sa[id];
    const head = it.t !== lastT ? `<h2 style="font-size:18px;margin-top:30px">${T[it.t].e}${esc(T[it.t].n)}</h2>` : ''; lastT = it.t;
    return `${head}<div class="card"><div class="qn">question ${i+1}</div><div class="q">${fmtQ(it.q)}</div>${preHTML(it)}<input class="ans" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="your answer"></div>`; }).join('');
  app.innerHTML = `<div class="stick"><div class="row"><b id="cnt">0/25 answered</b><span class="sp"></span><span class="pill" id="clock">${mock.timed?'60:00':'no timer'}</span><button class="btn sm pri" id="sub">Submit</button></div></div>${qs}
  <div class="row" style="margin-top:20px"><button class="btn pri" id="sub2">Submit exam</button></div>`;
  const upd = () => { const n = [...document.querySelectorAll('input.ans')].filter(x=>x.value.trim()).length; $('#cnt').textContent = `${n}/25 answered`; };
  document.querySelectorAll('input.ans').forEach(inp => { inp.oninput = () => { mock.ans[inp.dataset.i] = inp.value; upd(); };
    inp.onkeydown = e => { if (e.key==='Enter'){ const nx = document.querySelector(`input.ans[data-i="${+inp.dataset.i+1}"]`); if (nx) nx.focus(); } }; });
  let armedSub = false;
  const sub = () => { const n = mock.ids.length - Object.values(mock.ans).filter(v=>v.trim()).length;
    if (n && !armedSub){ armedSub = true; ['#sub','#sub2'].forEach(id => { const b=$(id); b.textContent = `${n} empty, submit anyway?`; b.classList.add('danger'); }); toast(`${n} question(s) still empty`); setTimeout(()=>{ armedSub=false; const a=$('#sub'), b=$('#sub2'); if(a){a.textContent='Submit'; a.classList.remove('danger');} if(b){b.textContent='Submit exam'; b.classList.remove('danger');} },5000); return; }
    mockEnd(); };
  $('#sub').onclick = sub; $('#sub2').onclick = sub;
  clearInterval(timer);
  if (mock.timed) timer = setInterval(() => { const left = 3600 - Math.floor((Date.now()-mock.t0)/1000); const c = $('#clock'); if (!c){ clearInterval(timer); return; }
    if (left <= 0){ clearInterval(timer); toast('Time is up'); mockEnd(); return; }
    c.textContent = `${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`; if (left < 300) c.style.background = 'var(--bad)'; }, 1000);
  document.querySelectorAll('input.ans').forEach(x => { x.value = mock.ans[x.dataset.i] || ''; }); upd();
  const f = document.querySelector('input.ans'); if (f) f.focus();
}
function mockEnd(){
  clearInterval(timer);
  mock.res = mock.ids.map((id,i) => check(DATA.sa[id], mock.ans[i]||''));
  mock.ids.forEach((id,i) => { const t = S.tstats[DATA.sa[id].t] ||= {ok:0,n:0}; t.n++; if (mock.res[i]) t.ok++; });
  mock.done = true; mockResults(true);
}
function mockResults(first){
  const n = mock.ids.length, s = mock.res.filter(Boolean).length, p = Math.round(100*s/n);
  if (first){ S.hist = (S.hist||[]).concat({d:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+new Date().toTimeString().slice(0,5), s, n, p}).slice(-30); save(); if (p>=70) confetti(); }
  else { const h = S.hist[S.hist.length-1]; if (h){ h.s=s; h.p=p; save(); } }
  const msg = p>=85 ? 'Certified sysadmin energy.' : p>=70 ? 'You would pass this. Keep it up.' : p>=50 ? 'Close. Drill the weak topics below.' : 'That is what practice is for. Go again.';
  const per = {}; mock.ids.forEach((id,i) => { const t = DATA.sa[id].t; (per[t] ||= [0,0]); per[t][1]++; if (mock.res[i]) per[t][0]++; });
  const used = (Date.now()-mock.t0)/60000;
  app.innerHTML = `<h2>Results</h2><div class="card" style="text-align:center"><div class="score">${p}%</div><div><b>${s}/${n}</b> correct · ${used.toFixed(0)} min</div><p class="lead" style="margin:8px 0 0">${msg}</p></div>
  <div class="card"><b>Per topic</b>${Object.entries(per).map(([t,[a,b]])=>{const q=Math.round(100*a/b); return `<div class="topicrow">${T[t].e}<span>${esc(T[t].n)}</span><div class="bar ${q>=70?'ok':q<50?'bad':''}"><i style="width:${q}%"></i></div><span class="mono small">${a}/${b}</span></div>`}).join('')}</div>
  <div class="row"><button class="btn pri" id="again">New mock exam</button><a class="btn" href="#/term">Drill in terminal</a></div>
  <h2>Review</h2>${mock.ids.map((id,i)=>{const it=DATA.sa[id],ok=mock.res[i],a=mock.ans[i]||''; return `<div class="rev ${ok?'ok':'bad'}"><div class="row"><span class="qn">Q${i+1} · ${esc(T[it.t].n)}</span><span class="sp"></span><span class="tag ${ok?'ok':'bad'}">${ok?'correct':'wrong'}</span></div>
    <div class="q">${fmtQ(it.q)}</div>${preHTML(it)}<div class="small">your answer: <code>${a.trim()?esc(a):'(empty)'}</code></div>
    <div class="small" style="margin-top:4px">answer: <code>${esc(it.a[0]||'(empty line)')}</code>${it.a.length>1?` <span class="muted">· also ok: ${it.a.slice(1,4).map(x=>`<code>${esc(x)}</code>`).join(' ')}</span>`:''}</div>
    ${it.ex?`<div class="small muted" style="margin-top:4px">${esc(it.ex)}</div>`:''}${!ok && a.trim()?`<button class="btn sm ghost" style="margin-top:8px" data-ov="${i}">I was right, count it</button>`:''}</div>`}).join('')}`;
  $('#again').onclick = () => { mock = null; mockStart(); scrollTo(0,0); };
  document.querySelectorAll('[data-ov]').forEach(b => b.onclick = () => { const i = +b.dataset.ov; mock.res[i] = true; const t = S.tstats[DATA.sa[mock.ids[i]].t]; if (t) t.ok++; save(); const y = scrollY; mockResults(false); scrollTo(0,y); });
}

// ================= QUIZ (MCQ)
let quiz = null;
function quizStart(){
  const pool = DATA.mcq.map((q,i)=>i).filter(i => sel().includes(DATA.mcq[i].t));
  quiz = {ids: shuffle(pool).slice(0,10), i:0, ok:0, picked:null};
  quizRender();
}

let drill = {};
function drillPool(kind){ return DATA.sa.map((q,i)=>i).filter(i => sel().includes(DATA.sa[i].t) && (kind==='term' ? DATA.sa[i].k==='cmd' : DATA.sa[i].k!=='cmd')); }
function drillNext(kind){
  const d = drill[kind] ||= {q:[], n:0, ok:0, cur:null};
  const key = sel().join();
  if (d.key !== key){ d.q = []; d.key = key; }
  if (!d.q.length) d.q = shuffle(drillPool(kind));
  d.cur = d.q.pop(); d.done = false; d.tries = 0;
}
function fill(){
  const d = drill.fill; if (!d || d.cur == null || d.key !== sel().join()) { drillNext('fill'); }
  const D = drill.fill; if (D.cur == null){ app.innerHTML = `<h2>Fill & predict</h2>${chips()}<p class="muted">Nothing for this selection.</p>`; bindChips(()=>{drill.fill=null; fill();}); return; }
  const it = DATA.sa[D.cur];
  app.innerHTML = `<h2>Fill & predict</h2><p class="lead" style="margin-bottom:6px">Fill the ________ or predict the output. Exactly like the exam.</p>${chips()}
  <div class="row small muted" style="margin-top:10px"><span>${T[it.t].e}${esc(T[it.t].n)}</span><span class="sp"></span><span>${D.ok}/${D.n} this session</span></div>
  <div class="card"><div class="q">${fmtQ(it.q)}</div>${preHTML(it)}<input class="ans" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type your answer + enter"><div id="fb"></div>
  <div class="row" style="margin-top:12px" id="acts"><button class="btn pri" id="ck">Check</button><button class="btn ghost" id="sh">Show answer</button><button class="btn ghost" id="sk">Skip</button></div></div>`;
  bindChips(() => { drill.fill = null; fill(); });
  const inp = $('#in'); inp.focus();
  const reveal = (ok, gaveUp) => { D.done = true; D.n++; if (ok) D.ok++; hit(ok, it.t); inp.classList.add(ok?'ok':'bad'); inp.readOnly = true;
    $('#fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Correct':gaveUp?'Answer':'Not quite'}</b> → <span class="acc">${esc(it.a[0]||'(empty line)')}</span>${it.a.length>1?` <span class="muted small">(also ok: ${it.a.slice(1,4).map(esc).join(' · ')})</span>`:''}${it.ex?`<div class="muted" style="margin-top:6px">${esc(it.ex)}</div>`:''}</div>`;
    $('#acts').innerHTML = `<button class="btn pri" id="nx">Next → <span class="kbd">enter</span></button>${!ok && !gaveUp ? '<button class="btn ghost" id="ov">I was right</button>':''}`;
    $('#nx').onclick = go; if ($('#ov')) $('#ov').onclick = () => { D.ok++; const t=S.tstats[it.t]; if(t) t.ok++; save(); go(); };
    setTimeout(()=>$('#nx').focus(),0); };
  const go = () => { drillNext('fill'); fill(); };
  $('#ck').onclick = () => { if (!inp.value.trim()) return inp.focus(); reveal(check(it, inp.value), false); };
  $('#sh').onclick = () => reveal(false, true);
  $('#sk').onclick = go;
  inp.onkeydown = e => { if (e.key === 'Enter' && !D.done) $('#ck').click(); };
}
function term(){
  if (!drill.term || drill.term.cur == null || drill.term.key !== sel().join()) drillNext('term');
  const D = drill.term;
  if (D.cur == null){ app.innerHTML = `<h2>Terminal</h2>${chips()}<p class="muted">No commands for this selection.</p>`; bindChips(()=>{drill.term=null; term();}); return; }
  const it = DATA.sa[D.cur];
  D.log = D.log || [];
  app.innerHTML = `<h2>Terminal</h2><p class="lead" style="margin-bottom:6px">Read the task, type the command, hit enter. Type <code>hint</code> for a hint, <code>?</code> to see the answer.</p>${chips()}
  <div class="term"><div class="top"><i></i><i></i><i></i><span>student@acs104:~ — ${esc(T[it.t].n)} · ${D.ok}/${D.n}</span></div>
  <div class="body">${D.log.slice(-2).map(l=>`<div class="hist"><div class="line"><span class="ps">student@acs104:~$</span><span>${esc(l.cmd)}</span></div><div class="out ${l.ok?'ok':'bad'}">${esc(l.msg)}</div></div>`).join('')}
  <div class="task">${esc(it.q)}</div>${it.sc?`<pre>${esc(DATA.sc[it.sc])}</pre>`:''}${it.pre?`<pre>${esc(it.pre)}</pre>`:''}

    if (v === 'hint'){ const a = it.a[0]; out('', `hint: starts with "${a.split(' ')[0]}"` + (a.split(' ').length>1?` · ${a.split(' ').length} words`:'')); inp.value=''; return; }

    const ok = check(it, v); D.tries++;
    if (ok){ D.done = true; D.n++; D.ok++; hit(true, it.t); out('ok', `correct${it.a.length>1 && norm(v)!==norm(it.a[0])?`  (also: ${it.a[0]})`:''}\n${it.ex||''}\n\n[enter] next`); D.log.push({cmd:v, ok:true, msg:'correct'}); }

    else { D.done = true; D.n++; hit(false, it.t); out('bad', `answer: ${it.a[0]}\n${it.ex||''}\n\n[enter] next`); D.log.push({cmd:v, ok:false, msg:'answer: '+it.a[0]}); }
  };
}

WD.glob = el => {

  let ci = 0;

  <div class="row" style="flex-wrap:nowrap"><code style="flex:none">$ ls data/</code><input type="text" id="gi" placeholder="e.g. a*  ??.txt  [ab]1.*" autocomplete="off" spellcheck="false"></div><div class="files"></div><div class="small" id="gm"></div>`;
  const setC = () => $('#gc', el).textContent = chal[ci][0];
  $('#gi', el).oninput = draw; $('#gn', el).onclick = () => { ci = (ci+1)%chal.length; setC(); $('#gi', el).value=''; draw(); }; $('#gs', el).onclick = () => { $('#gi', el).value = chal[ci][1]; draw(); };
  setC(); draw();
};
WD.perm = el => {
  const bits = [[1,1,1],[1,0,1],[0,0,0]];
  const draw = () => {
    const oct = bits.map(b => b[0]*4+b[1]*2+b[2]).join(''), str = bits.map(b => (b[0]?'r':'-')+(b[1]?'w':'-')+(b[2]?'x':'-')).join('');
    $$('.permgrid label', el).forEach(l => { const [i,j] = l.dataset.p.split(','); l.classList.toggle('on', !!bits[i][j]); });
    $('#po', el).innerHTML = `<b>${oct}</b> = <b>-${str}</b> → <code>chmod ${oct} file</code>`;
    const um = $('#um', el).value.trim(); const u = /^0?[0-7]{3}$/.test(um) ? um.slice(-3).split('').map(Number) : null;
    $('#uo', el).innerHTML = u ? (() => { const f = [6,6,6].map((v,i)=>v & ~u[i]), d = [7,7,7].map((v,i)=>v & ~u[i]); const s = a => a.map(n=>(n&4?'r':'-')+(n&2?'w':'-')+(n&1?'x':'-')).join(''); return `new file → <b>${f.join('')}</b> -${s(f)} · new directory → <b>${d.join('')}</b> d${s(d)}`; })() : 'type a umask like 0022';
  };
  el.innerHTML = `<div class="wt">try it · chmod & umask calculator</div><p class="small" style="margin:0 0 10px">Tap the boxes to switch permissions on and off.</p>
  <div class="permgrid"><span></span><span style="text-align:center">r (4)</span><span style="text-align:center">w (2)</span><span style="text-align:center">x (1)</span>
  ${['user (owner)','group','others'].map((n,i)=>`<span>${n}</span>${[0,1,2].map(j=>`<label data-p="${i},${j}">${'rwx'[j]}</label>`).join('')}`).join('')}</div>
  <div class="fb" id="po" style="margin-top:12px"></div>
  <div class="row" style="margin-top:14px;flex-wrap:nowrap"><code style="flex:none">umask</code><input type="text" id="um" value="0022" style="max-width:120px"></div><div class="fb" id="uo"></div>`;
  $$('.permgrid label', el).forEach(l => l.onclick = () => { const [i,j] = l.dataset.p.split(',').map(Number); bits[i][j] = bits[i][j] ? 0 : 1; draw(); });
  $('#um', el).oninput = draw; draw();
};

let keyH = null;
document.addEventListener('keydown', e => {
  if (keyH && !(e.target.tagName === 'INPUT')) keyH(e);
  if (e.key === 'Enter' && e.target.id === 'nx'){ /* handled by button */ }
});
function route(){
  const [r, sub] = (location.hash.replace(/^#\/?/,'') || '').split('/');
  keyH = null; nav(r); clearInterval(timer);
  if (r === 'notes'){ sub ? noteChapter(sub) : notesIndex(); scrollTo(0,0); return; }
  if (r !== 'mock' && mock && !mock.done) {} // keep unfinished mock in memory
  ({ '':home, mock: () => mock && !mock.done ? mockRun() : mock && mock.done ? mockResults(false) : mockStart(), quiz: quizStart, fill, term, flash, cheat }[r] || home)();
  if (r !== 'term' && r !== 'fill') scrollTo(0,0);
}
addEventListener('hashchange', route);
route();
window.__osf = { check, norm, DATA };
})();
