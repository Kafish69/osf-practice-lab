<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osf.lab — Linux exam practice</title>
<meta name="description" content="Practice for the KdG Operating System Fundamentals (Linux) T1 exam: mock exams, quizzes, fill-in, terminal drills and flashcards.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23d4ff3a' stroke='%23111' stroke-width='6'/></svg>">
<style>
:root{
  --bg:#fafaf8; --card:#ffffff; --ink:#111111; --mute:#77736b; --line:#e4e1da; --line2:#111111;
  --acc:#d4ff3a; --ok:#16a34a; --bad:#e11d48; --soft:#f1efea; --term:#111111; --termtx:#e8e6df;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  --r:12px;
}
[data-theme=dark]{
  --bg:#0f0f0f; --card:#161616; --ink:#eeeeea; --mute:#8d8a83; --line:#2a2a2a; --line2:#eeeeea; --soft:#1e1e1e; --term:#0a0a0a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
code,pre,.mono{font-family:var(--mono)}
code{background:var(--soft);padding:.1em .35em;border-radius:5px;font-size:.9em;white-space:pre-wrap}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 80px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:6px}
.logo{font:700 17px var(--mono);text-decoration:none;letter-spacing:-.3px}
.logo b{font-weight:700;color:var(--mute)}
.logo i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:8px;vertical-align:1px;box-shadow:0 0 0 1px var(--line2)}
.sp{flex:1}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font:500 12px var(--mono);color:var(--mute);background:var(--card)}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 11px;font:500 12px var(--mono);cursor:pointer}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:4px 0 0;scrollbar-width:none}
nav.tabs a{flex:none;text-decoration:none;font:500 14px var(--sans);padding:8px 10px 10px;color:var(--mute);border-bottom:2px solid transparent}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--ink)}
h1{font-size:clamp(34px,6.5vw,54px);line-height:1.05;letter-spacing:-1.8px;margin:44px 0 12px;font-weight:700}
h1 .hl{background:linear-gradient(transparent 62%,var(--acc) 62%);padding:0 2px}
h2{font-size:24px;letter-spacing:-.5px;margin:32px 0 6px;font-weight:700}
.lead{color:var(--mute);font-size:16px;margin:0 0 22px;max-width:620px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mode{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:border-color .15s, transform .15s}
.mode:hover{border-color:var(--line2);transform:translateY(-1px)}
.mode .em{font:500 12px var(--mono);color:var(--mute)}
.mode h3{margin:6px 0 4px;font-size:17px;font-weight:650}
.mode p{margin:0;color:var(--mute);font-size:14px}
.mode.big{border-color:var(--line2)}
.mode.big .em{color:var(--ink)}
.mode.big .em::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-left:8px;box-shadow:0 0 0 1px var(--line2)}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 15px;font:600 14px var(--sans);cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--line2)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri:hover{opacity:.88}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:4px 11px;font:500 13px var(--sans);cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--line2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.muted{color:var(--mute)}
.small{font-size:13px}
.num{font:500 11px var(--mono);color:var(--mute);margin-right:6px}
pre.sc{background:var(--soft);border-radius:8px;padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.5;margin:12px 0;white-space:pre}
.q{font-weight:600;font-size:16.5px;margin:4px 0 8px}
.qn{font:500 11px var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
input.ans{width:100%;font:500 15px var(--mono);padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);outline:none;transition:border-color .12s}
input.ans:focus{border-color:var(--line2)}
input.ans.ok{border-color:var(--ok)}
input.ans.bad{border-color:var(--bad)}
.fb{margin-top:12px;border-left:3px solid var(--line);padding:4px 0 4px 12px;font-size:14px}
.fb.ok{border-color:var(--ok)}
.fb.bad{border-color:var(--bad)}
.fb .acc{font-family:var(--mono);font-weight:600}
.opt{display:flex;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 13px;margin:8px 0;font:500 15px var(--sans);cursor:pointer;transition:border-color .12s}
.opt:hover{border-color:var(--line2)}
.opt .k{font:500 12px var(--mono);color:var(--mute);min-width:14px;flex:none;padding-top:2px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--card))}
.bar{height:6px;border-radius:999px;overflow:hidden;background:var(--soft)}
.bar i{display:block;height:100%;background:var(--ink);border-radius:999px}
.bar.ok i{background:var(--ok)} .bar.bad i{background:var(--bad)}
.stick{position:sticky;top:86px;z-index:10;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:6px}
.score{font:700 clamp(56px,13vw,96px)/1 var(--sans);letter-spacing:-3px;margin:8px 0}
.tag{display:inline-block;font:500 11px var(--mono);padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:var(--ok)} .tag.bad{color:var(--bad);border-color:var(--bad)}
.term{background:var(--term);color:var(--termtx);border-radius:var(--r);overflow:hidden;margin:16px 0}
.term .top{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid #222;align-items:center}
.term .top i{width:9px;height:9px;border-radius:50%;display:block;background:#333}
.term .top span{margin-left:8px;font:12px var(--mono);color:#8d8a83}
.term .body{padding:16px;font:14px/1.65 var(--mono)}
.term .task{color:#eeeeea;margin-bottom:6px;white-space:pre-wrap}
.term .task::before{content:"# ";color:#666}
.term pre{margin:6px 0 10px;color:#a9a59c;white-space:pre;overflow-x:auto}
.term .line{display:flex;gap:8px;align-items:center}
.term .ps{color:#d4ff3a;flex:none}
.term input{flex:1;background:transparent;border:none;outline:none;color:#fff;font:14px var(--mono);caret-color:#d4ff3a;min-width:0}
.term .out{white-space:pre-wrap;margin-top:6px}
.term .out.ok{color:#86efac} .term .out.bad{color:#fda4af}
.term .hist{opacity:.45}
.flash{perspective:1000px;margin:18px 0;cursor:pointer;user-select:none}
.flash .in{position:relative;min-height:220px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.flash .f{background:var(--card);font-size:21px;font-weight:650}
.flash .b{background:var(--card);border-color:var(--line2);transform:rotateY(180deg);font:500 16px/1.6 var(--mono)}
.flash small{position:absolute;top:12px;left:14px;font:500 11px var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.cheat h3{margin:0 0 8px;font-size:15px;font-weight:650}
.cheat ul{margin:0;padding-left:16px}
.cheat li{font:13px/1.75 var(--mono)}
.topicrow{display:grid;grid-template-columns:28px 1fr 110px 44px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.rev{border-left:2px solid var(--line);padding:4px 0 4px 14px;margin:18px 0}
.rev.ok{border-color:var(--ok)} .rev.bad{border-color:var(--bad)}
footer{color:var(--mute);font-size:12px;text-align:center;margin-top:44px;font-family:var(--mono)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:10px;font:500 14px var(--sans);z-index:99;animation:pop .2s}
@keyframes pop{from{transform:translate(-50%,8px);opacity:0}}
.kbd{font:500 11px var(--mono);border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.6}
@media (max-width:560px){ .topicrow{grid-template-columns:24px 1fr 64px 40px} .stick{top:84px} h1{letter-spacing:-1.2px} }
</style>
</head>

</div>

</script>
<script>
(() => {
const $ = s => document.querySelector(s);
const app = $('#app');
const T = Object.fromEntries(DATA.topics.map(([k,n],i) => [k,{n,e:`<span class="num">${String(i+1).padStart(2,'0')}</span>`}]));
const TK = DATA.topics.map(t => t[0]);

// ---------- storage (works even when blocked)
let S = {theme:null, topics:[], hist:[], tstats:{}, best:0, known:{}};
try { Object.assign(S, JSON.parse(localStorage.getItem('osf-lab')||'{}')); } catch(e){}
const save = () => { try { localStorage.setItem('osf-lab', JSON.stringify(S)); } catch(e){} };

// ---------- helpers
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmtQ = s => esc(s).replace(/ {2}(\S(?:.*?\S)?) {2}/g, ' <code>$1</code> ').replace(/ {2}(\S(?:.*?\S)?)( ?[.?!])?$/,' <code>$1</code>$2');
const preHTML = it => (it.sc ? `<pre class="sc">${esc(DATA.sc[it.sc])}</pre>` : '') + (it.pre ? `<pre class="sc">${esc(it.pre)}</pre>` : '');
const toast = m => { const d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),1800); };
function confetti(){}

// ---------- answer checking
function norm(s){
  s = String(s).replace(/[‘’`´]/g,"'").replace(/[“”]/g,'"').replace(/ /g,' ').trim().replace(/\s+/g,' ');
  s = s.replace(/^\$\s*/,'').replace(/^#\s+/,'').replace(/^sudo\s+/,'');
  s = s.replace(/\s*\|\s*/g,' | ').replace(/\s*;\s*/g,'; ').replace(/;\s*$/,'');
  s = s.replace(/\s*(\d?>>?|&>|<)\s*/g,' $1').trim();
  s = s.replace(/(^|\s)(-[a-zA-Z])\s+(?=[^-\s|])/g,'$1$2');
  s = s.replace(/(\S)\/$/,'$1');
  return s;
}
const unq = s => s.replace(/["']/g,'');
function setTokens(s, strip){
  let t = String(s).replace(/\band\b/gi,' ').split(/[\s,;]+/).filter(Boolean);
  if (strip) t = t.map(x => x.startsWith(strip) ? x.slice(strip.length) : x);
  return t.map(x=>x.replace(/\/$/,'')).sort().join(' ');
}
function variants(it, input){
  const v = [input];
  if (it.k === 'blank' && it.pre){
    const line = it.pre.split('\n').find(l => /_{4,}/.test(l)) || '';
    const parts = line.split(/_{4,}/), pre = norm(parts[0]), post = norm(parts[parts.length-1]);
    let x = norm(input);
    if (pre && x.startsWith(pre)) { x = x.slice(pre.length).trim(); v.push(x); }
    if (post && x.endsWith(post)) v.push(x.slice(0, x.length-post.length).trim());
  }
  return v;
}
function check(it, input){
  if (!String(input).trim()) return false;
  if (it.k === 'blank') return variants(it, input).some(x => check1(it, x));
  return check1(it, input);
}
function check1(it, input){
  if (!String(input).trim()) return false;
  const ci = x => it.ci ? x.toLowerCase() : x;
  if (it.set){ const u = ci(setTokens(input, it.strip)); return it.a.some(a => ci(setTokens(a, it.strip)) === u); }
  const u = ci(norm(input));
  return it.a.some(a => { const n = ci(norm(a)); return n === u || unq(n) === unq(u); });
}

// ---------- streak
let streak = 0;
function hit(ok, topic){
  streak = ok ? streak+1 : 0;
  if (streak > (S.best||0)) S.best = streak;
  if (topic){ const t = S.tstats[topic] ||= {ok:0,n:0}; t.n++; if (ok) t.ok++; }
  save(); $('#streak').textContent = 'streak ' + streak;
  if (ok && streak && streak % 10 === 0){ toast(`${streak} in a row. nice.`); }
}

// ---------- theme
function applyTheme(){ const t = S.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = t; $('#theme').textContent = t === 'dark' ? 'light' : 'dark'; }
$('#theme').onclick = () => { S.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); };
applyTheme();

// ---------- topic filter
const sel = () => (S.topics && S.topics.length) ? S.topics : TK;
function chips(onchange){
  const on = new Set(sel());
  const all = on.size === TK.length;
  return `<div class="chips" id="chips"><button class="chip ${all?'on':''}" data-t="*">all topics</button>${TK.map(k=>`<button class="chip ${!all&&on.has(k)?'on':''}" data-t="${k}">${T[k].e}${esc(T[k].n)}</button>`).join('')}</div>`;
}
function bindChips(onchange){
  document.querySelectorAll('#chips .chip').forEach(b => b.onclick = () => {
    const t = b.dataset.t; let cur = new Set(S.topics && S.topics.length ? S.topics : []);
    if (t === '*') cur = new Set(); else { cur.has(t) ? cur.delete(t) : cur.add(t); if (cur.size === TK.length) cur = new Set(); }
    S.topics = [...cur]; save(); onchange();
  });
}

// ---------- nav
const ROUTES = [['', 'Home'],['mock','Mock exam'],['quiz','Quiz'],['fill','Fill & predict'],['term','Terminal'],['flash','Flashcards'],['cheat','Cheat sheet']];
function nav(r){ $('#tabs').innerHTML = ROUTES.map(([k,n]) => `<a href="#/${k}" class="${k===r?'on':''}">${n}</a>`).join(''); }

// ================= HOME
function home(){
  const last = S.hist && S.hist.length ? S.hist[S.hist.length-1] : null;
  const rows = TK.map(k => { const t = S.tstats[k]; const p = t && t.n ? Math.round(100*t.ok/t.n) : null;
    return `<div class="topicrow">${T[k].e}<span>${esc(T[k].n)}</span><div class="bar ${p==null?'':p>=70?'ok':p<50?'bad':''}"><i style="width:${p??0}%"></i></div><span class="mono small">${p==null?'—':p+'%'}</span></div>`; }).join('');
  app.innerHTML = `
  <h1>Pass OSF<br><span class="hl">without crying.</span></h1>
  <p class="lead">Practice for the Operating System Fundamentals T1 exam: closed book, 1 hour, short answers. Every question is built from the Canvas chapters, slides and both practice exams.</p>
  <div class="facts"><span class="pill">${DATA.sa.length} exam-style Qs</span><span class="pill">${DATA.mcq.length} quiz Qs</span><span class="pill">${DATA.flash.length} flashcards</span><span class="pill">13 topics</span></div>
  <div class="grid" style="margin-top:18px">
    <a class="mode big" href="#/mock"><div class="em">01 — exam</div><h3>Mock exam</h3><p>25 random exam-style questions, 60-min timer, score per topic at the end. Different every time.</p></a>
    <a class="mode" href="#/term"><div class="em">02 — drill</div><h3>Terminal</h3><p>Type the command. Instant check. The closest thing to the real exam.</p></a>
    <a class="mode" href="#/fill"><div class="em">03 — drill</div><h3>Fill & predict</h3><p>Fill the ________ and predict outputs: paths, permissions, pipes.</p></a>
    <a class="mode" href="#/quiz"><div class="em">04 — concepts</div><h3>Quiz</h3><p>Quick multiple choice for the concepts.</p></a>
    <a class="mode" href="#/flash"><div class="em">05 — memory</div><h3>Flashcards</h3><p>Flip, remember, repeat the ones you don't know.</p></a>
    <a class="mode" href="#/cheat"><div class="em">06 — reference</div><h3>Cheat sheet</h3><p>All the commands on one page (for studying, not the exam).</p></a>
  </div>
  <div class="card"><div class="row"><b>Your topics</b><span class="sp"></span>${last?`<span class="small muted">last mock: <b>${last.p}%</b> · best streak: ${S.best||0}</span>`:`<span class="small muted">answer questions to fill these up</span>`}</div>${rows}
  <div class="row" style="margin-top:12px"><button class="btn sm ghost" id="reset">Reset progress</button><span class="small muted" id="rmsg"></span></div></div>
  <footer>made for KdG ACS · OSF 2026–27 · not official · double-check with your course PDFs</footer>`;
  const rb = $('#reset'); let armed = false;
  rb.onclick = () => {
    if (!armed){ armed = true; rb.textContent = 'Tap again to reset everything'; rb.classList.add('danger'); setTimeout(() => { if (armed && document.body.contains(rb)){ armed = false; rb.textContent = 'Reset progress'; rb.classList.remove('danger'); } }, 4000); return; }
    S.hist=[]; S.tstats={}; S.best=0; S.known={}; S.topics=[]; S.fl=null; save();
    streak = 0; $('#streak').textContent = 'streak 0'; mock = null; quiz = null; fl = null; drill = {};
    home(); toast('Progress reset');
  };
}

// ================= MOCK
let mock = null, timer = null;
function pickMock(){
  const by = {}; DATA.sa.forEach((q,i) => (by[q.t] ||= []).push(i));
  let ids = [];
  TK.forEach(k => ids.push(...shuffle(by[k]).slice(0,2)));
  ids = shuffle(ids).slice(0,25);
  return ids.sort((a,b) => TK.indexOf(DATA.sa[a].t) - TK.indexOf(DATA.sa[b].t) || a-b);
}
function mockStart(){
  app.innerHTML = `<h2>Mock exam</h2><p class="lead">25 questions across all 13 topics, in the same style as Piet's practice exams. Answer briefly: a command, a path or a few words. Closed book, so no peeking.</p>
  <div class="card"><label class="row"><input type="checkbox" id="tm" checked> <span>60-minute timer (like the real thing)</span></label>
  <p class="small muted" style="margin:10px 0 0">Tips: you don't need <code>sudo</code> or <code>$</code>. Spaces and quotes are flexible. If the checker marks a correct answer wrong, you can click "count it" in the review.</p></div>
  <div class="row"><button class="btn pri" id="go">Start the exam →</button></div>
  ${S.hist && S.hist.length ? `<div class="card"><b>History</b>${S.hist.slice(-8).reverse().map(h=>`<div class="row small" style="margin-top:6px"><span class="mono">${esc(h.d)}</span><span class="sp"></span><b>${h.p}%</b><span class="muted">(${h.s}/${h.n})</span></div>`).join('')}</div>`:''}`;
  $('#go').onclick = () => { mock = {ids: pickMock(), ans: {}, t0: Date.now(), timed: $('#tm').checked, done:false}; mockRun(); };
}
function mockRun(){
  let lastT = null;
  const qs = mock.ids.map((id,i) => { const it = DATA.sa[id];
    const head = it.t !== lastT ? `<h2 style="font-size:18px;margin-top:30px">${T[it.t].e}${esc(T[it.t].n)}</h2>` : ''; lastT = it.t;
    return `${head}<div class="card"><div class="qn">question ${i+1}</div><div class="q">${fmtQ(it.q)}</div>${preHTML(it)}<input class="ans" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="your answer"></div>`; }).join('');
  app.innerHTML = `<div class="stick"><div class="row"><b id="cnt">0/25 answered</b><span class="sp"></span><span class="pill" id="clock">${mock.timed?'60:00':'no timer'}</span><button class="btn sm pri" id="sub">Submit</button></div></div>${qs}
  <div class="row" style="margin-top:20px"><button class="btn pri" id="sub2">Submit exam</button></div>`;
  const upd = () => { const n = [...document.querySelectorAll('input.ans')].filter(x=>x.value.trim()).length; $('#cnt').textContent = `${n}/25 answered`; };
  document.querySelectorAll('input.ans').forEach(inp => { inp.oninput = () => { mock.ans[inp.dataset.i] = inp.value; upd(); };
    inp.onkeydown = e => { if (e.key==='Enter'){ const nx = document.querySelector(`input.ans[data-i="${+inp.dataset.i+1}"]`); if (nx) nx.focus(); } }; });
  let armedSub = false;
  const sub = () => { const n = mock.ids.length - Object.values(mock.ans).filter(v=>v.trim()).length;
    if (n && !armedSub){ armedSub = true; ['#sub','#sub2'].forEach(id => { const b=$(id); b.textContent = `${n} empty, submit anyway?`; b.classList.add('danger'); }); toast(`${n} question(s) still empty`); setTimeout(()=>{ armedSub=false; const a=$('#sub'), b=$('#sub2'); if(a){a.textContent='Submit'; a.classList.remove('danger');} if(b){b.textContent='Submit exam'; b.classList.remove('danger');} },5000); return; }
    mockEnd(); };
  $('#sub').onclick = sub; $('#sub2').onclick = sub;
  clearInterval(timer);
  if (mock.timed) timer = setInterval(() => { const left = 3600 - Math.floor((Date.now()-mock.t0)/1000); const c = $('#clock'); if (!c){ clearInterval(timer); return; }
    if (left <= 0){ clearInterval(timer); toast('Time is up'); mockEnd(); return; }
    c.textContent = `${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`; if (left < 300) c.style.background = 'var(--bad)'; }, 1000);
  document.querySelectorAll('input.ans').forEach(x => { x.value = mock.ans[x.dataset.i] || ''; }); upd();
  const f = document.querySelector('input.ans'); if (f) f.focus();
}
function mockEnd(){
  clearInterval(timer);
  mock.res = mock.ids.map((id,i) => check(DATA.sa[id], mock.ans[i]||''));
  mock.ids.forEach((id,i) => { const t = S.tstats[DATA.sa[id].t] ||= {ok:0,n:0}; t.n++; if (mock.res[i]) t.ok++; });
  mock.done = true; mockResults(true);
}
function mockResults(first){
  const n = mock.ids.length, s = mock.res.filter(Boolean).length, p = Math.round(100*s/n);
  if (first){ S.hist = (S.hist||[]).concat({d:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+new Date().toTimeString().slice(0,5), s, n, p}).slice(-30); save(); if (p>=70) confetti(); }
  else { const h = S.hist[S.hist.length-1]; if (h){ h.s=s; h.p=p; save(); } }
  const msg = p>=85 ? 'Certified sysadmin energy.' : p>=70 ? 'You would pass this. Keep it up.' : p>=50 ? 'Close. Drill the weak topics below.' : 'That is what practice is for. Go again.';
  const per = {}; mock.ids.forEach((id,i) => { const t = DATA.sa[id].t; (per[t] ||= [0,0]); per[t][1]++; if (mock.res[i]) per[t][0]++; });
  const used = (Date.now()-mock.t0)/60000;
  app.innerHTML = `<h2>Results</h2><div class="card" style="text-align:center"><div class="score">${p}%</div><div><b>${s}/${n}</b> correct · ${used.toFixed(0)} min</div><p class="lead" style="margin:8px 0 0">${msg}</p></div>
  <div class="card"><b>Per topic</b>${Object.entries(per).map(([t,[a,b]])=>{const q=Math.round(100*a/b); return `<div class="topicrow">${T[t].e}<span>${esc(T[t].n)}</span><div class="bar ${q>=70?'ok':q<50?'bad':''}"><i style="width:${q}%"></i></div><span class="mono small">${a}/${b}</span></div>`}).join('')}</div>
  <div class="row"><button class="btn pri" id="again">New mock exam</button><a class="btn" href="#/term">Drill in terminal</a></div>
  <h2>Review</h2>${mock.ids.map((id,i)=>{const it=DATA.sa[id],ok=mock.res[i],a=mock.ans[i]||''; return `<div class="rev ${ok?'ok':'bad'}"><div class="row"><span class="qn">Q${i+1} · ${esc(T[it.t].n)}</span><span class="sp"></span><span class="tag ${ok?'ok':'bad'}">${ok?'correct':'wrong'}</span></div>
    <div class="q">${fmtQ(it.q)}</div>${preHTML(it)}<div class="small">your answer: <code>${a.trim()?esc(a):'(empty)'}</code></div>
    <div class="small" style="margin-top:4px">answer: <code>${esc(it.a[0]||'(empty line)')}</code>${it.a.length>1?` <span class="muted">· also ok: ${it.a.slice(1,4).map(x=>`<code>${esc(x)}</code>`).join(' ')}</span>`:''}</div>
    ${it.ex?`<div class="small muted" style="margin-top:4px">${esc(it.ex)}</div>`:''}${!ok && a.trim()?`<button class="btn sm ghost" style="margin-top:8px" data-ov="${i}">I was right, count it</button>`:''}</div>`}).join('')}`;
  $('#again').onclick = () => { mock = null; mockStart(); scrollTo(0,0); };
  document.querySelectorAll('[data-ov]').forEach(b => b.onclick = () => { const i = +b.dataset.ov; mock.res[i] = true; const t = S.tstats[DATA.sa[mock.ids[i]].t]; if (t) t.ok++; save(); const y = scrollY; mockResults(false); scrollTo(0,y); });
}

// ================= QUIZ (MCQ)
let quiz = null;
function quizStart(){
  const pool = DATA.mcq.map((q,i)=>i).filter(i => sel().includes(DATA.mcq[i].t));
  quiz = {ids: shuffle(pool).slice(0,10), i:0, ok:0, picked:null};
  quizRender();
}
function quizRender(){
  if (!quiz) return quizStart();
  if (!quiz.ids.length){ app.innerHTML = `<h2>Quiz</h2>${chips()}<p class="muted">No quiz questions for this selection.</p>`; bindChips(quizStart); return; }
  if (quiz.i >= quiz.ids.length){ const p = Math.round(100*quiz.ok/quiz.ids.length); if (p>=80) confetti();
    app.innerHTML = `<h2>Quiz done</h2><div class="card" style="text-align:center"><div class="score">${quiz.ok}/${quiz.ids.length}</div><p class="lead">${p>=80?'Clean.':p>=50?'Not bad. Go again.':'Read the explanations and retry.'}</p></div><div class="row"><button class="btn pri" id="nq">New round</button></div>`;
    $('#nq').onclick = quizStart; return; }
  const it = DATA.mcq[quiz.ids[quiz.i]];
  if (!quiz.order) quiz.order = shuffle(it.o.map((_,j)=>j));
  app.innerHTML = `<h2>Quiz</h2>${chips()}<div class="row small muted" style="margin-top:8px"><span>question ${quiz.i+1}/${quiz.ids.length}</span><span class="sp"></span><span>${T[it.t].e}${esc(T[it.t].n)}</span></div>
  <div class="bar" style="margin:8px 0"><i style="width:${100*quiz.i/quiz.ids.length}%"></i></div>
  <div class="card"><div class="q">${fmtQ(it.q)}</div>${it.pre?`<pre class="sc">${esc(it.pre)}</pre>`:''}${quiz.order.map((j,n)=>`<button class="opt" data-j="${j}"><span class="k">${n+1}</span><span>${fmtQ(it.o[j])}</span></button>`).join('')}<div id="qfb"></div></div>`;
  bindChips(quizStart);
  const pick = j => { if (quiz.picked !== null) return; quiz.picked = j; const ok = j === it.a; if (ok) quiz.ok++; hit(ok, it.t);
    document.querySelectorAll('.opt').forEach(b => { const bj = +b.dataset.j; if (bj === it.a) b.classList.add('ok'); else if (bj === j) b.classList.add('bad'); });
    $('#qfb').innerHTML = `<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Correct':'Not quite'}</b>${it.ex?` · ${esc(it.ex)}`:''}</div><div class="row" style="margin-top:12px"><button class="btn pri" id="nx">Next → <span class="kbd">enter</span></button></div>`;
    $('#nx').onclick = next; $('#nx').focus(); };
  const next = () => { quiz.i++; quiz.picked = null; quiz.order = null; quizRender(); };
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.j));
  keyH = e => { if (quiz.picked === null && /^[1-4]$/.test(e.key)) { const j = quiz.order[+e.key-1]; if (j !== undefined) pick(j); } };
}

// ================= FILL & PREDICT / TERMINAL (shared engine)
let drill = {};
function drillPool(kind){ return DATA.sa.map((q,i)=>i).filter(i => sel().includes(DATA.sa[i].t) && (kind==='term' ? DATA.sa[i].k==='cmd' : DATA.sa[i].k!=='cmd')); }
function drillNext(kind){
  const d = drill[kind] ||= {q:[], n:0, ok:0, cur:null};
  const key = sel().join();
  if (d.key !== key){ d.q = []; d.key = key; }
  if (!d.q.length) d.q = shuffle(drillPool(kind));
  d.cur = d.q.pop(); d.done = false; d.tries = 0;
}
function fill(){
  const d = drill.fill; if (!d || d.cur == null || d.key !== sel().join()) { drillNext('fill'); }
  const D = drill.fill; if (D.cur == null){ app.innerHTML = `<h2>Fill & predict</h2>${chips()}<p class="muted">Nothing for this selection.</p>`; bindChips(()=>{drill.fill=null; fill();}); return; }
  const it = DATA.sa[D.cur];
  app.innerHTML = `<h2>Fill & predict</h2><p class="lead" style="margin-bottom:6px">Fill the ________ or predict the output. Exactly like the exam.</p>${chips()}
  <div class="row small muted" style="margin-top:10px"><span>${T[it.t].e}${esc(T[it.t].n)}</span><span class="sp"></span><span>${D.ok}/${D.n} this session</span></div>
  <div class="card"><div class="q">${fmtQ(it.q)}</div>${preHTML(it)}<input class="ans" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type your answer + enter"><div id="fb"></div>
  <div class="row" style="margin-top:12px" id="acts"><button class="btn pri" id="ck">Check</button><button class="btn ghost" id="sh">Show answer</button><button class="btn ghost" id="sk">Skip</button></div></div>`;
  bindChips(() => { drill.fill = null; fill(); });
  const inp = $('#in'); inp.focus();
  const reveal = (ok, gaveUp) => { D.done = true; D.n++; if (ok) D.ok++; hit(ok, it.t); inp.classList.add(ok?'ok':'bad'); inp.readOnly = true;
    $('#fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Correct':gaveUp?'Answer':'Not quite'}</b> → <span class="acc">${esc(it.a[0]||'(empty line)')}</span>${it.a.length>1?` <span class="muted small">(also ok: ${it.a.slice(1,4).map(esc).join(' · ')})</span>`:''}${it.ex?`<div class="muted" style="margin-top:6px">${esc(it.ex)}</div>`:''}</div>`;
    $('#acts').innerHTML = `<button class="btn pri" id="nx">Next → <span class="kbd">enter</span></button>${!ok && !gaveUp ? '<button class="btn ghost" id="ov">I was right</button>':''}`;
    $('#nx').onclick = go; if ($('#ov')) $('#ov').onclick = () => { D.ok++; const t=S.tstats[it.t]; if(t) t.ok++; save(); go(); };
    setTimeout(()=>$('#nx').focus(),0); };
  const go = () => { drillNext('fill'); fill(); };
  $('#ck').onclick = () => { if (!inp.value.trim()) return inp.focus(); reveal(check(it, inp.value), false); };
  $('#sh').onclick = () => reveal(false, true);
  $('#sk').onclick = go;
  inp.onkeydown = e => { if (e.key === 'Enter' && !D.done) $('#ck').click(); };
}
function term(){
  if (!drill.term || drill.term.cur == null || drill.term.key !== sel().join()) drillNext('term');
  const D = drill.term;
  if (D.cur == null){ app.innerHTML = `<h2>Terminal</h2>${chips()}<p class="muted">No commands for this selection.</p>`; bindChips(()=>{drill.term=null; term();}); return; }
  const it = DATA.sa[D.cur];
  D.log = D.log || [];
  app.innerHTML = `<h2>Terminal</h2><p class="lead" style="margin-bottom:6px">Read the task, type the command, hit enter. Type <code>hint</code> for a hint, <code>?</code> to see the answer.</p>${chips()}
  <div class="term"><div class="top"><i></i><i></i><i></i><span>student@acs104:~ — ${esc(T[it.t].n)} · ${D.ok}/${D.n}</span></div>
  <div class="body">${D.log.slice(-2).map(l=>`<div class="hist"><div class="line"><span class="ps">student@acs104:~$</span><span>${esc(l.cmd)}</span></div><div class="out ${l.ok?'ok':'bad'}">${esc(l.msg)}</div></div>`).join('')}
  <div class="task">${esc(it.q)}</div>${it.sc?`<pre>${esc(DATA.sc[it.sc])}</pre>`:''}${it.pre?`<pre>${esc(it.pre)}</pre>`:''}
  <div class="line"><span class="ps">student@acs104:~$</span><input id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="command"></div><div id="tout"></div></div></div>
  <div class="row"><button class="btn ghost sm" id="tsk">Skip</button><span class="small muted">no <code>sudo</code> needed · quotes & spacing are flexible</span></div>`;
  bindChips(() => { drill.term = null; term(); });
  const inp = $('#tin'); inp.focus();
  const out = (cls, txt) => { $('#tout').innerHTML = `<div class="out ${cls}">${esc(txt)}</div>`; };
  const next = () => { drillNext('term'); term(); };
  $('#tsk').onclick = next;
  inp.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const v = inp.value.trim();
    if (D.done){ next(); return; }
    if (!v) return;
    if (v === 'clear'){ D.log = []; term(); return; }
    if (v === 'hint'){ const a = it.a[0]; out('', `hint: starts with "${a.split(' ')[0]}"` + (a.split(' ').length>1?` · ${a.split(' ').length} words`:'')); inp.value=''; return; }
    if (v === '?' ){ D.done = true; D.n++; hit(false, it.t); out('bad', `answer: ${it.a[0]}\n${it.ex||''}\n\n[enter] next`); D.log.push({cmd:'?', ok:false, msg:it.a[0]}); inp.value=''; return; }
    const ok = check(it, v); D.tries++;
    if (ok){ D.done = true; D.n++; D.ok++; hit(true, it.t); out('ok', `correct${it.a.length>1 && norm(v)!==norm(it.a[0])?`  (also: ${it.a[0]})`:''}\n${it.ex||''}\n\n[enter] next`); D.log.push({cmd:v, ok:true, msg:'correct'}); }
    else if (D.tries < 2){ out('bad', `not quite, try again (or type hint / ?)`); inp.select(); }
    else { D.done = true; D.n++; hit(false, it.t); out('bad', `answer: ${it.a[0]}\n${it.ex||''}\n\n[enter] next`); D.log.push({cmd:v, ok:false, msg:'answer: '+it.a[0]}); }
  };
}

// ================= FLASHCARDS
let fl = null;
try { if (S.fl && Array.isArray(S.fl.q)) fl = S.fl; } catch(e){}
const flSave = () => { S.fl = fl; save(); };
function flashStart(){ const ids = DATA.flash.map((c,i)=>i).filter(i => sel().includes(DATA.flash[i].t)); fl = {q: shuffle(ids), got:0, total: ids.length, flipped:false, key: sel().join()}; flSave(); flash(); }
function flash(){
  if (!fl || fl.key !== sel().join()) return flashStart();
  if (!fl.q.length){
    app.innerHTML = `<h2>Flashcards</h2>${chips()}<div class="card" style="text-align:center"><div class="score">${fl.total?'done':'—'}</div><p class="lead" style="margin:8px auto 0">${fl.total?`All ${fl.total} cards known.`:'No cards for this selection.'}</p></div><div class="row"><button class="btn pri" id="again">Shuffle again</button></div>`;
    bindChips(flashStart); $('#again').onclick = flashStart; return; }
  const c = DATA.flash[fl.q[0]];
  app.innerHTML = `<h2>Flashcards</h2>${chips()}<div class="row small muted" style="margin-top:8px"><span>${fl.got}/${fl.total} known</span><span class="sp"></span><span>${fl.q.length} left</span></div>
  <div class="bar" style="margin:8px 0"><i style="width:${fl.total?100*fl.got/fl.total:0}%"></i></div>
  <div class="flash ${fl.flipped?'flip':''}" id="card"><div class="in">
    <div class="f"><small>${esc(T[c.t].n)}</small>${esc(c.f)}<div class="small muted" style="margin-top:14px;font-weight:500">tap to see the answer</div></div>
    <div class="b"><small>${esc(T[c.t].n)}</small><div class="small muted" style="font-family:var(--sans);margin-bottom:10px">${esc(c.f)}</div>${esc(c.b)}</div>
  </div></div>
  <div class="row" style="justify-content:center" id="facts"></div>`;
  bindChips(flashStart);
  const card = $('#card');
  const buttons = () => {
    $('#facts').innerHTML = fl.flipped
      ? `<button class="btn" id="lrn">Still learning <span class="kbd">←</span></button><button class="btn pri" id="gt">Got it <span class="kbd">→</span></button>`
      : `<button class="btn pri" id="show">Show answer <span class="kbd">space</span></button>`;
    if (fl.flipped){ $('#lrn').onclick = later; $('#gt').onclick = got; } else $('#show').onclick = flip;
  };
  const flip = () => { fl.flipped = !fl.flipped; card.classList.toggle('flip', fl.flipped); flSave(); buttons(); };
  // still learning: same card goes back into the deck a few cards later
  const later = () => { if (!fl.flipped) return; const id = fl.q.shift(); fl.q.splice(Math.min(fl.q.length, 3+Math.floor(Math.random()*3)), 0, id); fl.flipped = false; hit(false); flSave(); flash(); };
  const got = () => { if (!fl.flipped) return; fl.q.shift(); fl.got++; fl.flipped = false; hit(true); flSave(); flash(); };
  card.onclick = flip;
  buttons();
  keyH = e => { if (e.key===' '){ e.preventDefault(); flip(); } else if (e.key==='ArrowRight') got(); else if (e.key==='ArrowLeft') later(); };
}

// ================= CHEAT SHEET
function cheat(){
  app.innerHTML = `<h2>Cheat sheet</h2><p class="lead">Everything on one page. Read it, then close it and drill. (The exam is closed book!)</p>
  <div class="grid">${TK.map(k=>`<div class="card cheat" style="margin:0"><h3>${T[k].e}${esc(T[k].n)}</h3><ul>${DATA.cheat[k].map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`).join('')}</div>`;
}

// ---------- router
let keyH = null;
document.addEventListener('keydown', e => {
  if (keyH && !(e.target.tagName === 'INPUT')) keyH(e);
  if (e.key === 'Enter' && e.target.id === 'nx'){ /* handled by button */ }
});
function route(){
  const r = (location.hash.replace(/^#\/?/,'') || '').split('/')[0];
  keyH = null; nav(r); clearInterval(timer);
  if (r !== 'mock' && mock && !mock.done) {} // keep unfinished mock in memory
  ({ '':home, mock: () => mock && !mock.done ? mockRun() : mock && mock.done ? mockResults(false) : mockStart(), quiz: quizStart, fill, term, flash, cheat }[r] || home)();
  if (r !== 'term' && r !== 'fill') scrollTo(0,0);
}
addEventListener('hashchange', route);
route();
window.__osf = { check, norm, DATA };
})();
</script>
